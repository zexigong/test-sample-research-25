- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_anogan\\\
    test_anogan.py\nProject Programming Language: python\nTesting Framework: pytest\n\
    ### Source File Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\"\
    \"\"Anomaly Detection with Generative Adversarial Networks  (AnoGAN)\n Paper:\
    \ https://arxiv.org/pdf/1703.05921.pdf\n Note, that this is another implementation\
    \ of AnoGAN as the one from https://github.com/fuchami/ANOGAN\n\"\"\"\n# Author:\
    \ Michiel Bongaerts (but not author of the AnoGAN method)\n# License: BSD 2 clause\n\
    \nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\n\n\
    try:\n    import torch\nexcept ImportError:\n    print('please install torch first')\n\
    \nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom sklearn.preprocessing\
    \ import StandardScaler\nfrom sklearn.utils import check_array\nfrom sklearn.utils.validation\
    \ import check_is_fitted\nfrom torch.utils.data import DataLoader, TensorDataset\n\
    \nfrom .base import BaseDetector\nfrom ..utils.torch_utility import get_activation_by_name\n\
    from ..utils.utility import check_parameter\n\n\nclass Generator(nn.Module):\n\
    \    def __init__(self, latent_dim_G, n_features, G_layers, dropout_rate,\n  \
    \               activation_hidden, output_activation):\n        super(Generator,\
    \ self).__init__()\n        self.latent_dim = latent_dim_G\n        self.n_features\
    \ = n_features\n        self.layers = G_layers\n        self.dropout_rate = dropout_rate\n\
    \        self.activation_hidden = activation_hidden\n        self.output_activation\
    \ = output_activation\n\n        self.model = self._build_generator()\n\n    def\
    \ _build_generator(self):\n        layers = [nn.Dropout(self.dropout_rate), nn.Linear(\n\
    \            self.latent_dim, self.layers[0]),\n                  get_activation_by_name(self.activation_hidden)]\n\
    \        for i in range(1, len(self.layers)):\n            layers.extend([\n \
    \               nn.Dropout(self.dropout_rate),\n                nn.Linear(self.layers[i\
    \ - 1], self.layers[i]),\n                get_activation_by_name(self.activation_hidden)\n\
    \            ])\n        layers.append(nn.Linear(self.layers[-1], self.n_features))\n\
    \        if self.output_activation:\n            layers.append(get_activation_by_name(self.output_activation))\n\
    \        return nn.Sequential(*layers)\n\n    def forward(self, x):\n        return\
    \ self.model(x)\n\n\nclass Discriminator(nn.Module):\n    def __init__(self, n_features,\
    \ D_layers, dropout_rate, activation_hidden):\n        super(Discriminator, self).__init__()\n\
    \        self.n_features = n_features\n        self.layers = D_layers\n      \
    \  self.dropout_rate = dropout_rate\n        self.activation_hidden = activation_hidden\n\
    \n        self.model = self._build_discriminator()\n\n    def _build_discriminator(self):\n\
    \        layers = [nn.Dropout(self.dropout_rate), nn.Linear(\n            self.n_features,\
    \ self.layers[0]),\n                  get_activation_by_name(self.activation_hidden)]\n\
    \        for i in range(1, len(self.layers)):\n            layers.extend([\n \
    \               nn.Dropout(self.dropout_rate),\n                nn.Linear(self.layers[i\
    \ - 1], self.layers[i]),\n                get_activation_by_name(self.activation_hidden)\n\
    \            ])\n        layers.extend([nn.Linear(self.layers[-1], 1), nn.Sigmoid()])\n\
    \        return nn.Sequential(*layers)\n\n    def forward(self, x):\n        return\
    \ self.model(x)\n\n\nclass QueryModel(nn.Module):\n    def __init__(self, generator,\
    \ discriminator, latent_dim_G):\n        super(QueryModel, self).__init__()\n\
    \        self.generator = generator\n        self.discriminator = discriminator\n\
    \        self.z_gamma_layer = nn.Linear(latent_dim_G, latent_dim_G)\n\n    def\
    \ forward(self, query_sample):\n        z_gamma = self.z_gamma_layer(query_sample)\n\
    \        sample_gen = self.generator(z_gamma)\n        sample_disc_latent = self.discriminator(sample_gen)\n\
    \        return z_gamma, sample_gen, sample_disc_latent\n\n\nclass AnoGAN(BaseDetector):\n\
    \    \"\"\"Anomaly Detection with Generative Adversarial Networks  (AnoGAN).\n\
    \    See the original paper \"Unsupervised anomaly detection with generative\n\
    \    adversarial networks to guide marker discovery\".\n\n    See :cite:`schlegl2017unsupervised`\
    \ for details.\n\n    Parameters\n    ----------\n\n    output_activation : str,\
    \ optional (default=None)\n        Activation function to use for output layer.\n\
    \n\n    activation_hidden : str, optional (default='tanh')\n        Activation\
    \ function to use for output layer.\n\n    epochs : int, optional (default=500)\n\
    \        Number of epochs to train the model.\n\n    batch_size : int, optional\
    \ (default=32)\n        Number of samples per gradient update.\n\n    dropout_rate\
    \ : float in (0., 1), optional (default=0.2)\n        The dropout to be used across\
    \ all layers.\n\n    G_layers : list, optional (default=[20,10,3,10,20])\n   \
    \     List that indicates the number of nodes per hidden layer for the\n     \
    \   generator. Thus, [10,10] indicates 2 hidden layers having each 10 nodes.\n\
    \n    D_layers : list, optional (default=[20,10,5])\n        List that indicates\
    \ the number of nodes per hidden layer for the\n        discriminator. Thus, [10,10]\
    \ indicates 2 hidden layers having each 10\n        nodes.\n\n\n    learning_rate:\
    \ float in (0., 1), optional (default=0.001)\n        learning rate of training\
    \ the network\n\n    index_D_layer_for_recon_error: int, optional (default = 1)\n\
    \        This is the index of the hidden layer in the discriminator for which\n\
    \        the reconstruction error will be determined between query sample and\n\
    \        the sample created from the latent space.\n\n    learning_rate_query:\
    \ float in (0., 1), optional (default=0.001)\n        learning rate for the backpropagation\
    \ steps needed to find a point in\n        the latent space of the generator that\
    \ approximate the query sample\n\n\n    epochs_query: int, optional (default=20)\
    \ \n        Number of epochs to approximate the query sample in the latent space\n\
    \        of the generator\n\n    preprocessing : bool, optional (default=True)\n\
    \        If True, apply standardization on the data.\n\n    verbose : int, optional\
    \ (default=1)\n        Verbosity mode.\n        - 0 = silent\n        - 1 = progress\
    \ bar\n\n    contamination : float in (0., 0.5), optional (default=0.1)\n    \
    \    The amount of contamination of the data set, i.e.\n        the proportion\
    \ of outliers in the data set. When fitting this is used\n        to define the\
    \ threshold on the decision function.\n\n    Attributes\n    ----------\n\n  \
    \  decision_scores_ : numpy array of shape (n_samples,)\n        The outlier scores\
    \ of the training data [0,1].\n        The higher, the more abnormal. Outliers\
    \ tend to have higher\n        scores. This value is available once the detector\
    \ is\n        fitted.\n\n    threshold_ : float\n        The threshold is based\
    \ on ``contamination``. It is the\n        ``n_samples * contamination`` most\
    \ abnormal samples in\n        ``decision_scores_``. The threshold is calculated\
    \ for generating\n        binary outlier labels.\n\n    labels_ : int, either\
    \ 0 or 1\n        The binary labels of the training data. 0 stands for inliers\n\
    \        and 1 for outliers/anomalies. It is generated by applying\n        ``threshold_``\
    \ on ``decision_scores_``.\n    \"\"\"\n\n    def __init__(self, activation_hidden='tanh',\
    \ dropout_rate=0.2,\n                 latent_dim_G=2,\n                 G_layers=[20,\
    \ 10, 3, 10, 20], verbose=0, D_layers=[20, 10, 5],\n                 index_D_layer_for_recon_error=1,\
    \ epochs=500,\n                 preprocessing=False,\n                 learning_rate=0.001,\
    \ learning_rate_query=0.01,\n                 epochs_query=20,\n             \
    \    batch_size=32, output_activation=None, contamination=0.1,\n             \
    \    device=None):\n        super(AnoGAN, self).__init__(contamination=contamination)\n\
    \n        self.activation_hidden = activation_hidden\n        self.dropout_rate\
    \ = dropout_rate\n        self.latent_dim_G = latent_dim_G\n        self.G_layers\
    \ = G_layers\n        self.D_layers = D_layers\n        self.index_D_layer_for_recon_error\
    \ = index_D_layer_for_recon_error\n        self.output_activation = output_activation\n\
    \        self.contamination = contamination\n        self.epochs = epochs\n  \
    \      self.learning_rate = learning_rate\n        self.learning_rate_query =\
    \ learning_rate_query\n        self.epochs_query = epochs_query\n        self.preprocessing\
    \ = preprocessing\n        self.batch_size = batch_size\n        self.verbose\
    \ = verbose\n\n        self.hist_loss_generator = []\n        self.hist_loss_discriminator\
    \ = []\n\n        self.device = device\n\n        check_parameter(dropout_rate,\
    \ 0, 1,\n                        param_name='dropout_rate', include_left=True)\n\
    \n    def plot_learning_curves(self, start_ind=0,\n                          \
    \   window_smoothening=10):  # pragma: no cover\n        fig = plt.figure(figsize=(12,\
    \ 5))\n        l_gen = pd.Series(self.hist_loss_generator[start_ind:]).rolling(\n\
    \            window_smoothening).mean()\n        l_disc = pd.Series(self.hist_loss_discriminator[start_ind:]).rolling(\n\
    \            window_smoothening).mean()\n\n        ax = fig.add_subplot(1, 2,\
    \ 1)\n        ax.plot(range(len(l_gen)), l_gen)\n        ax.set_title('Generator')\n\
    \        ax.set_ylabel('Loss')\n        ax.set_xlabel('Iter')\n\n        ax =\
    \ fig.add_subplot(1, 2, 2)\n        ax.plot(range(len(l_disc)), l_disc)\n    \
    \    ax.set_title('Discriminator')\n        ax.set_ylabel('Loss')\n        ax.set_xlabel('Iter')\n\
    \n        plt.show()\n\n    def fit(self, X, y=None):\n        \"\"\"Fit detector.\
    \ y is ignored in unsupervised methods.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        y : Ignored\n            Not used, present for API consistency\
    \ by convention.\n\n        Returns\n        -------\n        self : object\n\
    \            Fitted estimator.\n        \"\"\"\n        # validate inputs X and\
    \ y (optional)\n        X = check_array(X)\n        self._set_n_classes(y)\n\n\
    \        # Verify and construct the hidden units\n        self.n_samples_, self.n_features_\
    \ = X.shape\n\n        # Standardize data for better performance\n        if self.preprocessing:\n\
    \            self.scaler_ = StandardScaler()\n            X_norm = self.scaler_.fit_transform(X)\n\
    \        else:\n            X_norm = np.copy(X)\n        X_norm = torch.tensor(X_norm,\
    \ dtype=torch.float32)\n        # train the discriminator and generator\n    \
    \    self.generator = Generator(latent_dim_G=self.latent_dim_G,\n            \
    \                       n_features=self.n_features_,\n                       \
    \            G_layers=self.G_layers,\n                                   dropout_rate=self.dropout_rate,\n\
    \                                   activation_hidden=self.activation_hidden,\n\
    \                                   output_activation=self.output_activation)\n\
    \        self.discriminator = Discriminator(n_features=self.n_features_,\n   \
    \                                        D_layers=self.D_layers,\n           \
    \                                dropout_rate=self.dropout_rate,\n           \
    \                                activation_hidden=self.activation_hidden)\n\n\
    \        self.generator.to(self.device)\n        self.discriminator.to(self.device)\n\
    \n        optimizer_g = optim.Adam(\n            self.generator.parameters(),\
    \ lr=self.learning_rate)\n        optimizer_d = optim.Adam(\n            self.discriminator.parameters(),\
    \ lr=self.learning_rate)\n\n        dataset = TensorDataset(X_norm)\n        dataloader\
    \ = DataLoader(\n            dataset, batch_size=self.batch_size, shuffle=True)\n\
    \n        for n in range(self.epochs):\n            if n % 100 == 0 and n != 0\
    \ and self.verbose == 1:\n                print(f'Train iter: {n}')\n\n      \
    \      self.generator.train()\n            self.discriminator.train()\n      \
    \      for X_train_ in dataloader:\n                X_train_sel = X_train_[0].to(self.device)\n\
    \                latent_noise = torch.rand(X_train_sel.size(\n               \
    \     0), self.latent_dim_G, dtype=torch.float32).to(self.device)\n\n        \
    \        generated_data = self.generator(latent_noise)\n                real_output\
    \ = self.discriminator(X_train_sel)\n                fake_output = self.discriminator(generated_data.detach())\n\
    \n                loss_D_real = nn.BCELoss()(real_output, torch.ones_like(\n \
    \                   real_output) * 0.9).to(self.device)\n                loss_D_fake\
    \ = nn.BCELoss()(fake_output,\n                                           torch.zeros_like(fake_output)).to(\n\
    \                    self.device)\n                loss_D = loss_D_real + loss_D_fake\n\
    \                optimizer_d.zero_grad()\n                loss_D.backward()\n\
    \                optimizer_d.step()\n\n                fake_output = self.discriminator(generated_data)\n\
    \                loss_G = nn.BCELoss()(fake_output,\n                        \
    \              torch.ones_like(fake_output)).to(\n                    self.device)\n\
    \                optimizer_g.zero_grad()\n                loss_G.backward()\n\
    \                optimizer_g.step()\n\n                self.hist_loss_discriminator.append(loss_D.item())\n\
    \                self.hist_loss_generator.append(loss_G.item())\n\n        # Instantiate\
    \ and train the query model\n        self.generator.eval()\n        self.discriminator.eval()\n\
    \        self.query_model = QueryModel(\n            self.generator, self.discriminator,\
    \ self.latent_dim_G).to(\n            self.device)\n        optimizer_query =\
    \ optim.Adam(\n            self.query_model.parameters(), lr=self.learning_rate_query)\n\
    \        scores = []\n        # For each sample, use a few backpropagation steps\
    \ to obtain a point in the latent space that best resembles the query sample\n\
    \        self.query_model.train()\n        for i in range(X_norm.shape[0]):\n\
    \            if self.verbose == 1:\n                print('query sample {} / {}'.format(i\
    \ + 1, X_norm.shape[0]))\n\n            query_sample = X_norm[[i],].to(self.device)\n\
    \            assert (query_sample.shape[0] == 1)\n            assert (query_sample.shape[1]\
    \ == self.n_features_)\n\n            # Make pseudo input (just zeros)\n     \
    \       zeros = torch.zeros((1, self.latent_dim_G)).to(self.device)\n\n      \
    \      # build model for back-propagating a approximate latent space where\n \
    \           # reconstruction with query sample is optimal\n            for i in\
    \ range(self.epochs_query):\n                if i % 25 == 0 and self.verbose ==\
    \ 1:\n                    print('iter:', i)\n\n                z, sample_gen,\
    \ sample_disc_latent = self.query_model(zeros)\n                with torch.no_grad():\n\
    \                    sample_disc_latent_original = self.discriminator(\n     \
    \                   query_sample)\n                # Reconstruction loss generator\n\
    \                loss_recon_gen = torch.mean(torch.mean(\n                   \
    \ torch.abs(query_sample - sample_gen), axis=-1))\n                # Reconstruction\
    \ loss latent space of discrimator\n                loss_recon_disc = torch.mean(torch.mean(\n\
    \                    torch.abs(\n                        sample_disc_latent_original\
    \ - sample_disc_latent),\n                    axis=-1))\n                total_loss\
    \ = loss_recon_gen + loss_recon_disc\n\n                optimizer_query.zero_grad()\n\
    \                total_loss.backward()\n                optimizer_query.step()\n\
    \            # Predict on X itself and calculate the reconstruction error as\n\
    \            # the outlier scores.\n            scores.append(total_loss.item())\n\
    \n        self.decision_scores_ = np.array(scores)\n        self._process_decision_scores()\n\
    \        return self\n\n    def decision_function(self, X):\n        \"\"\"Predict\
    \ raw anomaly score of X using the fitted detector.\n\n        The anomaly score\
    \ of an input sample is computed based on different\n        detector algorithms.\
    \ For consistency, outliers are assigned with\n        larger anomaly scores.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The training input samples. Sparse matrices are accepted\
    \ only\n            if they are supported by the base estimator.\n\n        Returns\n\
    \        -------\n        anomaly_scores : numpy array of shape (n_samples,)\n\
    \            The anomaly score of the input samples.\n        \"\"\"\n       \
    \ check_is_fitted(self, ['decision_scores_'])\n        X = check_array(X)\n\n\
    \        if self.preprocessing:\n            X_norm = self.scaler_.transform(X)\n\
    \        else:\n            X_norm = np.copy(X)\n\n        X_norm = torch.tensor(X_norm,\
    \ dtype=torch.float32)\n\n        # Predict on X\n        pred_scores = []\n\n\
    \        self.query_model.eval()\n        with torch.no_grad():\n            for\
    \ i in range(X_norm.shape[0]):\n                if self.verbose == 1:\n      \
    \              print(\n                        'query sample {} / {}'.format(i\
    \ + 1, X_norm.shape[0]))\n\n                query_sample = X_norm[[i],].to(self.device)\n\
    \n                zeros = torch.zeros((1, self.latent_dim_G)).to(self.device)\n\
    \                z, sample_gen, sample_disc_latent = self.query_model(zeros)\n\
    \                sample_disc_latent_original = self.discriminator(query_sample)\n\
    \n                loss_recon_gen = torch.mean(torch.mean(\n                  \
    \  torch.abs(query_sample - sample_gen), axis=-1))\n                loss_recon_disc\
    \ = torch.mean(torch.mean(\n                    torch.abs(\n                 \
    \       sample_disc_latent_original - sample_disc_latent),\n                 \
    \   axis=-1))\n                total_loss = loss_recon_gen + loss_recon_disc\n\
    \                pred_scores.append(total_loss.item())\n\n        return np.array(pred_scores)\n\
    \n### Source File Dependency Files Content\n### Dependency File: base.py\n# -*-\
    \ coding: utf-8 -*-\n\"\"\"Base class for all outlier detector models\n\"\"\"\n\
    # Author: Yue Zhao <yzhao062@gmail.com>\n# License: BSD 2 clause\n\n\nimport abc\n\
    import warnings\nfrom collections import defaultdict\nfrom inspect import signature\n\
    \nimport numpy as np\nfrom numpy import percentile\nfrom scipy.special import\
    \ erf\nfrom scipy.stats import binom\nfrom sklearn.metrics import roc_auc_score\n\
    from sklearn.preprocessing import MinMaxScaler\nfrom sklearn.utils import deprecated\n\
    from sklearn.utils.multiclass import check_classification_targets\nfrom sklearn.utils.validation\
    \ import check_is_fitted\nfrom scipy.optimize import root_scalar\n\nfrom .sklearn_base\
    \ import _pprint\nfrom ..utils.utility import precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n\
    \    \"\"\"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n\
    \    ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
    \n        # allow arbitrary input such as PyThreshld object\n        self.contamination\
    \ = contamination\n\n    # noinspection PyIncorrectDocstring\n    @abc.abstractmethod\n\
    \    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        pass\n\n    @abc.abstractmethod\n    def\
    \ decision_function(self, X):\n        \"\"\"Predict raw anomaly scores of X using\
    \ the fitted detector.\n\n        The anomaly score of an input sample is computed\
    \ based on the fitted\n        detector. For consistency, outliers are assigned\
    \ with\n        higher anomaly scores.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        pass\n\n    @deprecated()\n    def fit_predict(self,\
    \ X, y=None):\n        \"\"\"Fit detector first and then predict whether a particular\
    \ sample\n        is an outlier or not. y is ignored in unsupervised models.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n\n        .. deprecated:: 0.6.9\n          `fit_predict`\
    \ will be removed in pyod 0.8.0.; it will be\n          replaced by calling `fit`\
    \ function first and then accessing\n          `labels_` attribute for consistency.\n\
    \        \"\"\"\n\n        self.fit(X, y)\n        return self.labels_\n\n   \
    \ def predict(self, X, return_confidence=False):\n        \"\"\"Predict if a particular\
    \ sample is an outlier or not.\n\n        Parameters\n        ----------\n   \
    \     X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        return_confidence : boolean, optional(default=False)\n \
    \           If True, also return the confidence of prediction.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n        confidence : numpy array of shape (n_samples,).\n\
    \            Only if return_confidence is set to True.\n        \"\"\"\n\n   \
    \     check_is_fitted(self, ['decision_scores_', 'threshold_', 'labels_'])\n \
    \       pred_score = self.decision_function(X)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (pred_score > self.threshold_).astype('int').ravel()\n\
    \n        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(pred_score)\n\n        if return_confidence:\n   \
    \         confidence = self.predict_confidence(X)\n            return prediction,\
    \ confidence\n\n        return prediction\n\n    def predict_proba(self, X, method='linear',\
    \ return_confidence=False):\n        \"\"\"Predict the probability of a sample\
    \ being outlier. Two approaches\n        are possible:\n\n        1. simply use\
    \ Min-max conversion to linearly transform the outlier\n           scores into\
    \ the range of [0,1]. The model must be\n           fitted first.\n        2.\
    \ use unifying scores, see :cite:`kriegel2011interpreting`.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The input samples.\n\n        method : str, optional (default='linear')\n\
    \            probability conversion method. It must be one of\n            'linear'\
    \ or 'unify'.\n\n        return_confidence : boolean, optional(default=False)\n\
    \            If True, also return the confidence of prediction.\n\n\n        Returns\n\
    \        -------\n        outlier_probability : numpy array of shape (n_samples,\
