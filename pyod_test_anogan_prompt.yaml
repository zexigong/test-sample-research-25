    \ ub_cost = self.compute_rejection_stats(\n                T=T, delta=delta,\n\
    \                c_fp=c_fp, c_fn=c_fn, c_r=c_r)\n            return prediction,\
    \ [expected_rejrate, ub_rejrate, ub_cost]\n\n        return prediction\n\n   \
    \ def compute_rejection_stats(self, T=32, delta=0.1, c_fp=1, c_fn=1, c_r=-1,\n\
    \                                verbose=False):\n        \"\"\"Add reject option\
    \ into the unsupervised detector. \n           This comes with guarantees: an\
    \ estimate of the expected\n           rejection rate (return_rejectrate=True),\
    \ an upper\n           bound of the rejection rate (return_ub_rejectrate= True),\n\
    \           and an upper bound on the cost (return_ub_cost=True).\n          \
    \ \n        Parameters\n        ----------\n        T: int, optional(default=32)\n\
    \           It allows to set the rejection threshold to 1-2exp(-T).\n        \
    \   The higher the value of T, the more rejections are made.\n            \n \
    \       delta: float, optional (default = 0.1)\n               The upper bound\
    \ rejection rate holds with probability 1-delta.\n                       \n  \
    \      c_fp, c_fn, c_r: floats (positive),\n                         optional\
    \ (default = [1,1, contamination])\n                         costs for false positive\
    \ predictions (c_fp),\n                         false negative predictions (c_fn)\
    \ and rejections (c_r).\n                         \n        verbose: bool, optional\
    \ (default = False)\n                 If true, it prints the expected rejection\
    \ rate, the upper\n                 bound rejection rate, and the upper bound\
    \ of the cost.\n\n        Returns\n        -------\n        expected_rejection_rate:\
    \   float, the expected rejection rate;\n        upperbound_rejection_rate: float,\
    \ the upper bound for the rejection rate\n                                   satisfied\
    \ with probability 1-delta;\n        upperbound_cost:           float, the upper\
    \ bound for the cost;\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        if c_r < 0:\n            c_r = self.contamination\n\
    \n        if delta <= 0 or delta >= 1:\n            delta = 0.1\n\n        # Computing\
    \ the expected rejection rate\n        n = len(self.decision_scores_)\n      \
    \  n_gamma_minus1 = int(n * self.contamination) - 1\n        argsmin = (n_gamma_minus1,\
    \ n, 1 - np.exp(-T))\n        argsmax = (n_gamma_minus1, n, np.exp(-T))\n    \
    \    q1 = root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n           \
    \              bracket=[0, 1], method='brentq', args=argsmin).root\n        q2\
    \ = root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n                 \
    \        bracket=[0, 1], method='brentq', args=argsmax).root\n        expected_reject_rate\
    \ = q2 - q1\n\n        # Computing the upper bound for the rejection rate\n  \
    \      right_mar = (-self.contamination * (n + 2) + n + 1) / n + (\n         \
    \           T * (n + 2)) / (np.sqrt(2 * n ** 3 * T))\n        right_mar = min(1,\
    \ right_mar)\n        left_mar = (\n                (2 + n * (1 - self.contamination)\
    \ * (n + 1)) / n ** 2\n                - np.sqrt(\n            0.5 * n ** 5 *\
    \ (\n                    2 * n * (\n                    -3 * self.contamination\
    \ ** 2\n                    - 2 * n * (1 - self.contamination) ** 2\n        \
    \            + 4 * self.contamination - 3\n            )\n                   \
    \ + T * (n + 2) ** 2 - 8\n            )\n        ) / n ** 4\n        )\n     \
    \   left_mar = max(0, left_mar)\n        add_term = 2 * np.sqrt(np.log(2 / delta)\
    \ / (2 * n))\n        upperbound_rejectrate = right_mar - left_mar + add_term\n\
    \n        # Computing the upper bound for the cost function\n        n_gamma_minus1\
    \ = int(n * self.contamination) - 1\n        argsmin = (n_gamma_minus1, n, 1 -\
    \ np.exp(-T))\n        argsmax = (n_gamma_minus1, n, np.exp(-T))\n        q1 =\
    \ root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n                   \
    \      bracket=[0, 1], method='brentq', args=argsmin).root\n        q2 = root_scalar(lambda\
    \ p, k, n, C: binom.cdf(k, n, p) - C,\n                         bracket=[0, 1],\
    \ method='brentq', args=argsmax).root\n        upperbound_cost = np.min([self.contamination,\
    \ q1]) * c_fp + np.min(\n            [1 - q2, self.contamination]) * c_fn + (q2\
    \ - q1) * c_r\n\n        if verbose:\n            print(\"Expected rejection rate:\
    \ \",\n                  np.round(expected_reject_rate, 4), '%')\n           \
    \ print(\"Upper bound rejection rate: \",\n                  np.round(upperbound_rejectrate,\
    \ 4), '%')\n            print(\"Upper bound cost: \", np.round(upperbound_cost,\
    \ 4))\n\n        return expected_reject_rate, upperbound_rejectrate, upperbound_cost\n\
    \n    def _predict_rank(self, X, normalized=False):\n        \"\"\"Predict the\
    \ outlyingness rank of a sample by a fitted model. The\n        method is for\
    \ outlier detector score combination.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        normalized : bool, optional (default=False)\n          \
    \  If set to True, all ranks are normalized to [0,1].\n\n        Returns\n   \
    \     -------\n        ranks : array, shape (n_samples,)\n            Outlying\
    \ rank of a sample according to the training data.\n\n        \"\"\"\n\n     \
    \   check_is_fitted(self, ['decision_scores_'])\n\n        test_scores = self.decision_function(X)\n\
    \        train_scores = self.decision_scores_\n\n        sorted_train_scores =\
    \ np.sort(train_scores)\n        ranks = np.searchsorted(sorted_train_scores,\
    \ test_scores)\n\n        if normalized:\n            # return normalized ranks\n\
    \            ranks = ranks / ranks.max()\n        return ranks\n\n    @deprecated()\n\
