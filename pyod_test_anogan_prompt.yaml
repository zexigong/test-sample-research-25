    \ first and then accessing\n          `labels_` attribute for consistency. Scoring\
    \ could be done by\n          calling an evaluation method, e.g., AUC ROC.\n \
    \       \"\"\"\n\n        self.fit(X)\n\n        if scoring == 'roc_auc_score':\n\
    \            score = roc_auc_score(y, self.decision_scores_)\n        elif scoring\
    \ == 'prc_n_score':\n            score = precision_n_scores(y, self.decision_scores_)\n\
    \        else:\n            raise NotImplementedError('PyOD built-in scoring only\
