    # -*- coding: utf-8 -*-\n\"\"\"Utility functions for PyTorch models\n\"\"\"\n\
    # Author: Tiankai Yang <tiankaiy@usc.edu>\n# License: BSD 2 clause\n\nimport torch\n\
    import torch.nn as nn\n\n\nclass TorchDataset(torch.utils.data.Dataset):\n   \
    \ def __init__(self, X, y=None, mean=None, std=None, eps=1e-8,\n             \
    \    X_dtype=torch.float32, y_dtype=torch.float32,\n                 return_idx=False):\n\
    \        self.X = X\n        self.y = y\n        self.mean = mean\n        self.std\
    \ = std\n        self.eps = eps\n        self.X_dtype = X_dtype\n        self.y_dtype\
    \ = y_dtype\n        self.return_idx = return_idx\n\n    def __len__(self):\n\
    \        return len(self.X)\n\n    def __getitem__(self, idx):\n        if torch.is_tensor(idx):\n\
    \            idx = idx.tolist()\n        sample = self.X[idx, :]\n\n        if\
    \ self.mean is not None and self.std is not None:\n            sample = (sample\
    \ - self.mean) / (self.std + self.eps)\n\n        if self.y is not None:\n   \
    \         if self.return_idx:\n                return torch.as_tensor(sample,\
    \ dtype=self.X_dtype), \\\n                    torch.as_tensor(self.y[idx], dtype=self.y_dtype),\
    \ idx\n            else:\n                return torch.as_tensor(sample, dtype=self.X_dtype),\
    \ \\\n                    torch.as_tensor(self.y[idx], dtype=self.y_dtype)\n \
    \       else:\n            if self.return_idx:\n                return torch.as_tensor(sample,\
    \ dtype=self.X_dtype), idx\n            else:\n                return torch.as_tensor(sample,\
    \ dtype=self.X_dtype)\n\n\nclass LinearBlock(nn.Module):\n    \"\"\"\n    Linear\
    \ block with activation and batch normalization\n\n    Parameters\n    ----------\n\
