- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_hbos\\\
    test_hbos.py\nProject Programming Language: python\nTesting Framework: pytest\n\
    ### Source File Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\"\
    \"\"Histogram-based Outlier Detection (HBOS)\n\"\"\"\n# Author: Yue Zhao <yzhao062@gmail.com>\n\
    # License: BSD 2 clause\n\n\nimport numpy as np\nfrom numba import njit\nfrom\
    \ sklearn.utils import check_array\nfrom sklearn.utils.validation import check_is_fitted\n\
    \nfrom .base import BaseDetector\nfrom ..utils.utility import check_parameter\n\
    from ..utils.utility import get_optimal_n_bins\nfrom ..utils.utility import invert_order\n\
    \n\nclass HBOS(BaseDetector):\n    \"\"\"Histogram- based outlier detection (HBOS)\
    \ is an efficient unsupervised\n    method. It assumes the feature independence\
    \ and calculates the degree\n    of outlyingness by building histograms. See :cite:`goldstein2012histogram`\n\
    \    for details.    \n\n    Two versions of HBOS are supported:        \n   \
    \ - Static number of bins: uses a static number of bins for all features.\n  \
    \  - Automatic number of bins: every feature uses a number of bins deemed to \n\
    \      be optimal according to the Birge-Rozenblac method\n      (:cite:`birge2006many`).\n\
    \      \n    Parameters\n    ----------\n    n_bins : int or string, optional\
    \ (default=10)\n        The number of bins. \"auto\" uses the birge-rozenblac\
    \ method for\n        automatic selection of the optimal number of bins for each\
    \ feature.\n\n    alpha : float in (0, 1), optional (default=0.1)\n        The\
    \ regularizer for preventing overflow.\n\n    tol : float in (0, 1), optional\
    \ (default=0.5)\n        The parameter to decide the flexibility while dealing\n\
    \        the samples falling outside the bins.\n\n    contamination : float in\
    \ (0., 0.5), optional (default=0.1)\n        The amount of contamination of the\
    \ data set,\n        i.e. the proportion of outliers in the data set. Used when\
    \ fitting to\n        define the threshold on the decision function.\n\n    Attributes\n\
    \    ----------\n    bin_edges_ : numpy array of shape (n_bins + 1, n_features\
    \ )\n        The edges of the bins.\n\n    hist_ : numpy array of shape (n_bins,\
    \ n_features)\n        The density of each histogram.\n\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    def __init__(self, n_bins=10, alpha=0.1, tol=0.5, contamination=0.1):\n \
    \       super(HBOS, self).__init__(contamination=contamination)\n        self.n_bins\
    \ = n_bins\n        self.alpha = alpha\n        self.tol = tol\n\n        check_parameter(alpha,\
    \ 0, 1, param_name='alpha')\n        check_parameter(tol, 0, 1, param_name='tol')\n\
    \n    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        # validate inputs X and y (optional)\n \
    \       X = check_array(X)\n        self._set_n_classes(y)\n\n        _, n_features\
    \ = X.shape[0], X.shape[1]\n\n        if isinstance(self.n_bins, str) and self.n_bins.lower()\
    \ == \"auto\":\n            # Uses the birge rozenblac method for automatic histogram\
    \ size per feature\n            self.hist_ = []\n            self.bin_edges_ =\
    \ []\n\n            # build the histograms for all dimensions\n            for\
    \ i in range(n_features):\n                n_bins = get_optimal_n_bins(X[:, i])\n\
    \                hist, bin_edges = np.histogram(X[:, i], bins=n_bins,\n      \
    \                                         density=True)\n                self.hist_.append(hist)\n\
    \                self.bin_edges_.append(bin_edges)\n                # the sum\
    \ of (width * height) should equal to 1\n                assert (np.isclose(1,\
    \ np.sum(\n                    hist * np.diff(bin_edges)), atol=0.1))\n\n    \
    \        outlier_scores = _calculate_outlier_scores_auto(X, self.bin_edges_,\n\
    \                                                            self.hist_,\n   \
    \                                                         self.alpha,\n      \
    \                                                      self.tol)\n\n        elif\
    \ check_parameter(self.n_bins, low=2, high=np.inf):\n            self.hist_ =\
    \ np.zeros([self.n_bins, n_features])\n            self.bin_edges_ = np.zeros([self.n_bins\
    \ + 1, n_features])\n\n            # build the histograms for all dimensions\n\
    \            for i in range(n_features):\n                self.hist_[:, i], self.bin_edges_[:,\
    \ i] = \\\n                    np.histogram(X[:, i], bins=self.n_bins, density=True)\n\
    \                # the sum of (width * height) should equal to 1\n           \
    \     assert (np.isclose(1, np.sum(\n                    self.hist_[:, i] * np.diff(self.bin_edges_[:,\
    \ i])),\n                                   atol=0.1))\n\n            outlier_scores\
    \ = _calculate_outlier_scores(X, self.bin_edges_,\n                          \
    \                             self.hist_,\n                                  \
    \                     self.n_bins,\n                                         \
    \              self.alpha, self.tol)\n\n        # invert decision_scores_. Outliers\
    \ comes with higher outlier scores\n        self.decision_scores_ = invert_order(np.sum(outlier_scores,\
    \ axis=1))\n        self._process_decision_scores()\n        return self\n\n \
    \   def decision_function(self, X):\n        \"\"\"Predict raw anomaly score of\
    \ X using the fitted detector.\n\n        The anomaly score of an input sample\
    \ is computed based on different\n        detector algorithms. For consistency,\
    \ outliers are assigned with\n        larger anomaly scores.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The training input samples. Sparse matrices are accepted only\n \
    \           if they are supported by the base estimator.\n\n        Returns\n\
    \        -------\n        anomaly_scores : numpy array of shape (n_samples,)\n\
    \            The anomaly score of the input samples.\n        \"\"\"\n       \
    \ check_is_fitted(self, ['hist_', 'bin_edges_'])\n        X = check_array(X)\n\
    \n        if isinstance(self.n_bins, str) and self.n_bins.lower() == \"auto\"\
    :\n            outlier_scores = _calculate_outlier_scores_auto(X, self.bin_edges_,\n\
    \                                                            self.hist_,\n   \
    \                                                         self.alpha,\n      \
    \                                                      self.tol)\n        elif\
    \ check_parameter(self.n_bins, low=2, high=np.inf):\n            outlier_scores\
    \ = _calculate_outlier_scores(X, self.bin_edges_,\n                          \
    \                             self.hist_,\n                                  \
    \                     self.n_bins,\n                                         \
    \              self.alpha, self.tol)\n        return invert_order(np.sum(outlier_scores,\
    \ axis=1))\n\n\n# @njit #due to variable size of histograms, can no longer naively\
    \ use numba for jit\ndef _calculate_outlier_scores_auto(X, bin_edges, hist, alpha,\n\
    \                                   tol):  # pragma: no cover\n    \"\"\"The internal\
    \ function to calculate the outlier scores based on\n    the bins and histograms\
    \ constructed with the training data. The program\n    is optimized through numba.\
    \ It is excluded from coverage test for\n    eliminating the redundancy.\n\n \
    \   Parameters\n    ----------\n    X : numpy array of shape (n_samples, n_features\n\
    \        The input samples.\n\n    bin_edges : list of length n_features containing\
    \ numpy arrays\n        The edges of the bins.\n\n    hist : =list of length n_features\
    \ containing numpy arrays\n        The density of each histogram.\n\n    alpha\
    \ : float in (0, 1)\n        The regularizer for preventing overflow.\n\n    tol\
    \ : float in (0, 1)\n        The parameter to decide the flexibility while dealing\n\
    \        the samples falling outside the bins.\n\n    Returns\n    -------\n \
    \   outlier_scores : numpy array of shape (n_samples, n_features)\n        Outlier\
    \ scores on all features (dimensions).\n    \"\"\"\n\n    n_samples, n_features\
    \ = X.shape[0], X.shape[1]\n    outlier_scores = np.zeros(shape=(n_samples, n_features))\n\
    \n    for i in range(n_features):\n\n        # Find the indices of the bins to\
    \ which each value belongs.\n        # See documentation for np.digitize since\
    \ it is tricky\n        # >>> x = np.array([0.2, 6.4, 3.0, 1.6, -1, 100, 10])\n\
    \        # >>> bins = np.array([0.0, 1.0, 2.5, 4.0, 10.0])\n        # >>> np.digitize(x,\
    \ bins, right=True)\n        # array([1, 4, 3, 2, 0, 5, 4], dtype=int64)\n\n \
    \       bin_inds = np.digitize(X[:, i], bin_edges[i], right=True)\n\n        #\
    \ Calculate the outlying scores on dimension i\n        # Add a regularizer for\
    \ preventing overflow\n        out_score_i = np.log2(hist[i] + alpha)\n\n    \
    \    optimal_n_bins = get_optimal_n_bins(X[:, i])\n\n        for j in range(n_samples):\n\
    \n            # If the sample does not belong to any bins\n            # bin_ind\
    \ == 0 (fall outside since it is too small)\n            if bin_inds[j] == 0:\n\
    \                dist = bin_edges[i][0] - X[j, i]\n                bin_width =\
    \ bin_edges[i][1] - bin_edges[i][0]\n\n                # If it is only slightly\
    \ lower than the smallest bin edge\n                # assign it to bin 1\n   \
    \             if dist <= bin_width * tol:\n                    outlier_scores[j,\
    \ i] = out_score_i[0]\n                else:\n                    outlier_scores[j,\
    \ i] = np.min(out_score_i)\n\n            # If the sample does not belong to any\
    \ bins\n            # bin_ind == optimal_n_bins+1 (fall outside since it is too\
    \ large)\n            elif bin_inds[j] == optimal_n_bins + 1:\n              \
    \  dist = X[j, i] - bin_edges[i][-1]\n                bin_width = bin_edges[i][-1]\
    \ - bin_edges[i][-2]\n\n                # If it is only slightly larger than the\
    \ largest bin edge\n                # assign it to the last bin\n            \
    \    if dist <= bin_width * tol:\n                    outlier_scores[j, i] = out_score_i[optimal_n_bins\
    \ - 1]\n                else:\n                    outlier_scores[j, i] = np.min(out_score_i)\n\
    \            else:\n                outlier_scores[j, i] = out_score_i[bin_inds[j]\
    \ - 1]\n\n    return outlier_scores\n\n\n@njit\ndef _calculate_outlier_scores(X,\
    \ bin_edges, hist, n_bins, alpha,\n                              tol):  # pragma:\
    \ no cover\n    \"\"\"The internal function to calculate the outlier scores based\
    \ on\n    the bins and histograms constructed with the training data. The program\n\
    \    is optimized through numba. It is excluded from coverage test for\n    eliminating\
    \ the redundancy.\n\n    Parameters\n    ----------\n    X : numpy array of shape\
    \ (n_samples, n_features)\n        The input samples.\n\n    bin_edges : numpy\
    \ array of shape (n_bins + 1, n_features )\n        The edges of the bins.\n\n\
    \    hist : numpy array of shape (n_bins, n_features)\n        The density of\
    \ each histogram.\n\n    n_bins : int\n        The number of bins. \n\n    alpha\
    \ : float in (0, 1)\n        The regularizer for preventing overflow.\n\n    tol\
    \ : float in (0, 1)\n        The parameter to decide the flexibility while dealing\n\
    \        the samples falling outside the bins.\n\n    Returns\n    -------\n \
    \   outlier_scores : numpy array of shape (n_samples, n_features)\n        Outlier\
    \ scores on all features (dimensions).\n    \"\"\"\n\n    n_samples, n_features\
    \ = X.shape[0], X.shape[1]\n    outlier_scores = np.zeros(shape=(n_samples, n_features))\n\
    \n    for i in range(n_features):\n\n        # Find the indices of the bins to\
    \ which each value belongs.\n        # See documentation for np.digitize since\
    \ it is tricky\n        # >>> x = np.array([0.2, 6.4, 3.0, 1.6, -1, 100, 10])\n\
    \        # >>> bins = np.array([0.0, 1.0, 2.5, 4.0, 10.0])\n        # >>> np.digitize(x,\
    \ bins, right=True)\n        # array([1, 4, 3, 2, 0, 5, 4], dtype=int64)\n\n \
    \       bin_inds = np.digitize(X[:, i], bin_edges[:, i], right=True)\n\n     \
    \   # Calculate the outlying scores on dimension i\n        # Add a regularizer\
    \ for preventing overflow\n        out_score_i = np.log2(hist[:, i] + alpha)\n\
    \n        for j in range(n_samples):\n\n            # If the sample does not belong\
    \ to any bins\n            # bin_ind == 0 (fall outside since it is too small)\n\
    \            if bin_inds[j] == 0:\n                dist = bin_edges[0, i] - X[j,\
    \ i]\n                bin_width = bin_edges[1, i] - bin_edges[0, i]\n\n      \
    \          # If it is only slightly lower than the smallest bin edge\n       \
    \         # assign it to bin 1\n                if dist <= bin_width * tol:\n\
    \                    outlier_scores[j, i] = out_score_i[0]\n                else:\n\
    \                    outlier_scores[j, i] = np.min(out_score_i)\n\n          \
    \  # If the sample does not belong to any bins\n            # bin_ind == n_bins+1\
    \ (fall outside since it is too large)\n            elif bin_inds[j] == n_bins\
    \ + 1:\n                dist = X[j, i] - bin_edges[-1, i]\n                bin_width\
    \ = bin_edges[-1, i] - bin_edges[-2, i]\n\n                # If it is only slightly\
    \ larger than the largest bin edge\n                # assign it to the last bin\n\
    \                if dist <= bin_width * tol:\n                    outlier_scores[j,\
    \ i] = out_score_i[n_bins - 1]\n                else:\n                    outlier_scores[j,\
    \ i] = np.min(out_score_i)\n            else:\n                outlier_scores[j,\
    \ i] = out_score_i[bin_inds[j] - 1]\n\n    return outlier_scores\n\n### Source\
    \ File Dependency Files Content\n### Dependency File: base.py\n# -*- coding: utf-8\
    \ -*-\n\"\"\"Base class for all outlier detector models\n\"\"\"\n# Author: Yue\
    \ Zhao <yzhao062@gmail.com>\n# License: BSD 2 clause\n\n\nimport abc\nimport warnings\n\
    from collections import defaultdict\nfrom inspect import signature\n\nimport numpy\
    \ as np\nfrom numpy import percentile\nfrom scipy.special import erf\nfrom scipy.stats\
    \ import binom\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.preprocessing\
    \ import MinMaxScaler\nfrom sklearn.utils import deprecated\nfrom sklearn.utils.multiclass\
    \ import check_classification_targets\nfrom sklearn.utils.validation import check_is_fitted\n\
    from scipy.optimize import root_scalar\n\nfrom .sklearn_base import _pprint\n\
    from ..utils.utility import precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n\
    \    \"\"\"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n\
    \    ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
    \n        # allow arbitrary input such as PyThreshld object\n        self.contamination\
    \ = contamination\n\n    # noinspection PyIncorrectDocstring\n    @abc.abstractmethod\n\
    \    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        pass\n\n    @abc.abstractmethod\n    def\
    \ decision_function(self, X):\n        \"\"\"Predict raw anomaly scores of X using\
    \ the fitted detector.\n\n        The anomaly score of an input sample is computed\
    \ based on the fitted\n        detector. For consistency, outliers are assigned\
    \ with\n        higher anomaly scores.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        pass\n\n    @deprecated()\n    def fit_predict(self,\
    \ X, y=None):\n        \"\"\"Fit detector first and then predict whether a particular\
    \ sample\n        is an outlier or not. y is ignored in unsupervised models.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n\n        .. deprecated:: 0.6.9\n          `fit_predict`\
    \ will be removed in pyod 0.8.0.; it will be\n          replaced by calling `fit`\
    \ function first and then accessing\n          `labels_` attribute for consistency.\n\
    \        \"\"\"\n\n        self.fit(X, y)\n        return self.labels_\n\n   \
    \ def predict(self, X, return_confidence=False):\n        \"\"\"Predict if a particular\
    \ sample is an outlier or not.\n\n        Parameters\n        ----------\n   \
    \     X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        return_confidence : boolean, optional(default=False)\n \
    \           If True, also return the confidence of prediction.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n        confidence : numpy array of shape (n_samples,).\n\
    \            Only if return_confidence is set to True.\n        \"\"\"\n\n   \
    \     check_is_fitted(self, ['decision_scores_', 'threshold_', 'labels_'])\n \
    \       pred_score = self.decision_function(X)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (pred_score > self.threshold_).astype('int').ravel()\n\
    \n        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(pred_score)\n\n        if return_confidence:\n   \
    \         confidence = self.predict_confidence(X)\n            return prediction,\
    \ confidence\n\n        return prediction\n\n    def predict_proba(self, X, method='linear',\
    \ return_confidence=False):\n        \"\"\"Predict the probability of a sample\
    \ being outlier. Two approaches\n        are possible:\n\n        1. simply use\
    \ Min-max conversion to linearly transform the outlier\n           scores into\
    \ the range of [0,1]. The model must be\n           fitted first.\n        2.\
    \ use unifying scores, see :cite:`kriegel2011interpreting`.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The input samples.\n\n        method : str, optional (default='linear')\n\
    \            probability conversion method. It must be one of\n            'linear'\
    \ or 'unify'.\n\n        return_confidence : boolean, optional(default=False)\n\
    \            If True, also return the confidence of prediction.\n\n\n        Returns\n\
    \        -------\n        outlier_probability : numpy array of shape (n_samples,\
    \ n_classes)\n            For each observation, tells whether or not\n       \
    \     it should be considered as an outlier according to the\n            fitted\
    \ model. Return the outlier probability, ranging\n            in [0,1]. Note it\
    \ depends on the number of classes, which is by\n            default 2 classes\
    \ ([proba of normal, proba of outliers]).\n        \"\"\"\n\n        check_is_fitted(self,\
    \ ['decision_scores_', 'threshold_', 'labels_'])\n        train_scores = self.decision_scores_\n\
    \n        test_scores = self.decision_function(X)\n\n        probs = np.zeros([X.shape[0],\
    \ int(self._classes)])\n        if method == 'linear':\n            scaler = MinMaxScaler().fit(train_scores.reshape(-1,\
    \ 1))\n            probs[:, 1] = scaler.transform(\n                test_scores.reshape(-1,\
    \ 1)).ravel().clip(0, 1)\n            probs[:, 0] = 1 - probs[:, 1]\n\n      \
    \      if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n\n    \
    \    elif method == 'unify':\n            # turn output into probability\n   \
    \         pre_erf_score = (test_scores - self._mu) / (\n                    self._sigma\
    \ * np.sqrt(2))\n            erf_score = erf(pre_erf_score)\n            probs[:,\
    \ 1] = erf_score.clip(0, 1).ravel()\n            probs[:, 0] = 1 - probs[:, 1]\n\
    \n            if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n      \
    \  else:\n            raise ValueError(method,\n                             'is\
    \ not a valid probability conversion method')\n\n    def predict_confidence(self,\
    \ X):\n        \"\"\"Predict the model's confidence in making the same prediction\n\
    \        under slightly different training sets.\n        See :cite:`perini2020quantifying`.\n\
    \n        Parameters\n        -------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        Returns\n        -------\n\
    \        confidence : numpy array of shape (n_samples,)\n            For each\
    \ observation, tells how consistently the model would\n            make the same\
    \ prediction if the training set was perturbed.\n            Return a probability,\
    \ ranging in [0,1].\n\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        n = len(self.decision_scores_)\n\n    \
    \    # todo: this has an optimization opportunity since the scores may\n     \
    \   # already be available\n        test_scores = self.decision_function(X)\n\n\
