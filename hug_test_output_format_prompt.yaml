    \      key = camelcase(key)\n            new_dictionary[key] = _camelcase(value)\n\
    \        return new_dictionary\n    elif isinstance(content, list):\n        new_list\
    \ = []\n        for element in content:\n            new_list.append(_camelcase(element))\n\
    \        return new_list\n    else:\n        return content\n\n\n@content_type(\"\
    application/json; charset=utf-8\")\ndef json_camelcase(content, **kwargs):\n \
    \   \"\"\"JSON (Javascript Serialized Object Notation) with all keys camelCased\"\
    \"\"\n    return json(_camelcase(content), **kwargs)\n\n\n@content_type(\"application/json;\
    \ charset=utf-8\")\ndef pretty_json(content, **kwargs):\n    \"\"\"JSON (Javascript\
    \ Serialized Object Notion) pretty printed and indented\"\"\"\n    return json(content,\
    \ indent=4, separators=(\",\", \": \"), **kwargs)\n\n\ndef image(image_format,\
    \ doc=None):\n    \"\"\"Dynamically creates an image type handler for the specified\
    \ image type\"\"\"\n\n    @on_valid(\"image/{0}\".format(image_format))\n    def\
    \ image_handler(data, **kwargs):\n        if hasattr(data, \"read\"):\n      \
    \      return data\n        elif hasattr(data, \"save\"):\n            output\
    \ = stream()\n            if introspect.takes_all_arguments(data.save, \"format\"\
    ) or introspect.takes_kwargs(\n                data.save\n            ):\n   \
    \             data.save(output, format=image_format.upper())\n            else:\n\
