    \    return image_handler\n\n\nfor image_type in IMAGE_TYPES:\n    globals()[\"\
    {0}_image\".format(image_type.replace(\"+\", \"_\"))] = image(image_type)\n\n\n\
    def video(video_type, video_mime, doc=None):\n    \"\"\"Dynamically creates a\
