    \        kwargs[\"response\"] = response\n            return function(content,\
    \ **valid_kwargs(kwargs))\n\n        return output_content\n\n    return wrapper\n\
    \n\n@content_type(\"text/plain; charset=utf-8\")\ndef text(content, **kwargs):\n\
    \    \"\"\"Free form UTF-8 text\"\"\"\n    if hasattr(content, \"read\"):\n  \
