    \ numpy array of shape (n_samples,)\n        binary labels 0: normal points and\
    \ 1: outliers\n\n    Examples\n    --------\n    >>> from pyod.utils.utility import\
    \ get_label_n\n    >>> y = [0, 1, 1, 0, 0]\n    >>> y_pred = [0.1, 0.5, 0.3, 0.2,\
