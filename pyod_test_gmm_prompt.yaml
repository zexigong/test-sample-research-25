  role: system
- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_gmm\\test_gmm.py\n\
    Project Programming Language: python\nTesting Framework: pytest\n### Source File\
    \ Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\"\"\"\nOutlier\
    \ detection based on Gaussian Mixture Model (GMM).\n\"\"\"\n# Author: Akira Tamamori\
    \ <tamamori5917@gmail.com>\n# License: BSD 2 clause\n\n\nfrom sklearn.mixture\
    \ import GaussianMixture\nfrom sklearn.utils import check_array\nfrom sklearn.utils.validation\
    \ import check_is_fitted\n\nfrom pyod.models.base import BaseDetector\nfrom pyod.utils.utility\
    \ import invert_order\n\n\nclass GMM(BaseDetector):\n    \"\"\"Wrapper of scikit-learn\
    \ Gaussian Mixture Model with more functionalities.\n    Unsupervised Outlier\
    \ Detection.\n\n    See :cite:`aggarwal2015outlier` Chapter 2 for details.\n\n\
    \    Parameters\n    ----------\n    n_components : int, default=1\n        The\
    \ number of mixture components.\n\n    covariance_type : {'full', 'tied', 'diag',\
    \ 'spherical'}, default='full'\n        String describing the type of covariance\
    \ parameters to use.\n\n    tol : float, default=1e-3\n        The convergence\
    \ threshold. EM iterations will stop when the\n        lower bound average gain\
    \ is below this threshold.\n\n    reg_covar : float, default=1e-6\n        Non-negative\
    \ regularization added to the diagonal of covariance.\n        Allows to assure\
    \ that the covariance matrices are all positive.\n\n    max_iter : int, default=100\n\
    \        The number of EM iterations to perform.\n\n    n_init : int, default=1\n\
    \        The number of initializations to perform. The best results are kept.\n\
    \n    init_params : {'kmeans', 'random'}, default='kmeans'\n        The method\
    \ used to initialize the weights, the means and the\n        precisions.\n\n \
    \   weights_init : array-like of shape (n_components, ), default=None\n      \
    \  The user-provided initial weights.\n        If it is None, weights are initialized\
    \ using the `init_params` method.\n\n    means_init : array-like of shape (n_components,\
    \ n_features), default=None\n        The user-provided initial means,\n      \
    \  If it is None, means are initialized using the `init_params` method.\n\n  \
    \  precisions_init : array-like, default=None\n        The user-provided initial\
    \ precisions (inverse of the covariance\n        matrices).\n        If it is\
    \ None, precisions are initialized using the 'init_params'\n        method.\n\n\
    \    random_state : int, RandomState instance or None, default=None\n        Controls\
    \ the random seed given to the method chosen to initialize the\n        parameters.\n\
    \n    warm_start : bool, default=False\n        If 'warm_start' is True, the solution\
    \ of the last fitting is used as\n        initialization for the next call of\
    \ fit().\n\n    verbose : int, default=0\n        Enable verbose output.\n\n \
    \   verbose_interval : int, default=10\n        Number of iteration done before\
    \ the next print.\n\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set.\n\n    Attributes\n    ----------\n\
    \    weights_ : array-like of shape (n_components,)\n        The weights of each\
    \ mixture components.\n\n    means_ : array-like of shape (n_components, n_features)\n\
    \        The mean of each mixture component.\n\n    covariances_ : array-like\n\
    \        The covariance of each mixture component.\n\n    precisions_ : array-like\n\
    \        The precision matrices for each component in the mixture.\n\n    precisions_cholesky_\
    \ : array-like\n        The cholesky decomposition of the precision matrices of\
    \ each mixture\n        component.\n\n    converged_ : bool\n        True when\
    \ convergence was reached in fit(), False otherwise.\n\n    n_iter_ : int\n  \
    \      Number of step used by the best fit of EM to reach the convergence.\n\n\
    \    lower_bound_ : float\n        Lower bound value on the log-likelihood (of\
    \ the training data with\n        respect to the model) of the best fit of EM.\n\
    \n    decision_scores_ : numpy array of shape (n_samples,)\n        The outlier\
    \ scores of the training data.\n\n    threshold_ : float\n        The threshold\
    \ is based on ``contamination``. It is the\n        ``n_samples * contamination``\
    \ most abnormal samples in\n        ``decision_scores_``. The threshold is calculated\
    \ for generating\n        binary outlier labels.\n\n    labels_ : int, either\
    \ 0 or 1\n        The binary labels of the training data. 0 stands for inliers\n\
    \        and 1 for outliers/anomalies. It is generated by applying\n        ``threshold_``\
    \ on ``decision_scores_``.\n    \"\"\"\n\n    def __init__(\n            self,\n\
    \            n_components=1,\n            covariance_type=\"full\",\n        \
    \    tol=1e-3,\n            reg_covar=1e-6,\n            max_iter=100,\n     \
    \       n_init=1,\n            init_params=\"kmeans\",\n            weights_init=None,\n\
    \            means_init=None,\n            precisions_init=None,\n           \
    \ random_state=None,\n            warm_start=False,\n            contamination=0.1,\n\
    \    ):\n        super().__init__(contamination=contamination)\n        self.n_components\
    \ = n_components\n        self.covariance_type = covariance_type\n        self.tol\
    \ = tol\n        self.reg_covar = reg_covar\n        self.max_iter = max_iter\n\
    \        self.n_init = n_init\n        self.init_params = init_params\n      \
    \  self.weights_init = weights_init\n        self.means_init = means_init\n  \
    \      self.precisions_init = precisions_init\n        self.random_state = random_state\n\
    \        self.warm_start = warm_start\n\n        self.detector_ = None\n     \
    \   self.decision_scores_ = None\n\n    def fit(self, X, y=None):\n        \"\"\
    \"Fit detector. y is ignored in unsupervised methods.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The input samples.\n\n        y : Ignored\n            Not used,\
    \ present for API consistency by convention.\n\n        sample_weight : array-like,\
    \ shape (n_samples,)\n            Per-sample weights. Rescale C per sample. Higher\
    \ weights\n            force the classifier to put more emphasis on these points.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        # validate inputs X and y (optional)\n \
    \       X = check_array(X)\n        self._set_n_classes(y)\n\n        self.detector_\
    \ = GaussianMixture(\n            n_components=self.n_components,\n          \
    \  covariance_type=self.covariance_type,\n            tol=self.tol,\n        \
    \    reg_covar=self.reg_covar,\n            max_iter=self.max_iter,\n        \
    \    n_init=self.n_init,\n            init_params=self.init_params,\n        \
    \    weights_init=self.weights_init,\n            means_init=self.means_init,\n\
    \            precisions_init=self.precisions_init,\n            random_state=self.random_state,\n\
    \            warm_start=self.warm_start,\n        )\n\n        self.detector_.fit(X=X,\
    \ y=y)\n\n        # invert decision_scores_. Outliers comes with higher outlier\
    \ scores\n        self.decision_scores_ = invert_order(self.detector_.score_samples(X))\n\
    \        self._process_decision_scores()\n\n        return self\n\n    def decision_function(self,\
    \ X):\n        \"\"\"Predict raw anomaly score of X using the fitted detector.\n\
    \n        The anomaly score of an input sample is computed based on different\n\
    \        detector algorithms. For consistency, outliers are assigned with\n  \
    \      larger anomaly scores.\n\n        Parameters\n        ----------\n    \
    \    X : numpy array of shape (n_samples, n_features)\n            The training\
    \ input samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        check_is_fitted(self, [\"decision_scores_\"\
    , \"threshold_\", \"labels_\"])\n\n        # Invert outlier scores. Outliers come\
    \ with higher outlier scores\n        return invert_order(self.detector_.score_samples(X))\n\
    \n    @property\n    def weights_(self):\n        \"\"\"The weights of each mixture\
    \ components.\n        Decorator for scikit-learn Gaussian Mixture Model attributes.\n\
    \        \"\"\"\n        return self.detector_.weights_\n\n    @property\n   \
    \ def means_(self):\n        \"\"\"The mean of each mixture component.\n     \
    \   Decorator for scikit-learn Gaussian Mixture Model attributes.\n        \"\"\
    \"\n        return self.detector_.means_\n\n    @property\n    def covariances_(self):\n\
    \        \"\"\"The covariance of each mixture component.\n        Decorator for\
    \ scikit-learn Gaussian Mixture Model attributes.\n        \"\"\"\n        return\
    \ self.detector_.covariances_\n\n    @property\n    def precisions_(self):\n \
    \       \"\"\"The precision matrices for each component in the mixture.\n    \
    \    Decorator for scikit-learn Gaussian Mixture Model attributes.\n        \"\
    \"\"\n        return self.detector_.precisions_\n\n    @property\n    def precisions_cholesky_(self):\n\
    \        \"\"\"The cholesky decomposition of the precision matrices\n        \
    \   of each mixture component.\n        Decorator for scikit-learn Gaussian Mixture\
    \ Model attributes.\n        \"\"\"\n        return self.detector_.precisions_cholesky_\n\
    \n    @property\n    def converged_(self):\n        \"\"\"True when convergence\
    \ was reached in fit(), False otherwise.\n        Decorator for scikit-learn Gaussian\
    \ Mixture Model attributes.\n        \"\"\"\n        return self.detector_.converged_\n\
    \n    @property\n    def n_iter_(self):\n        \"\"\"Number of step used by\
    \ the best fit of EM to reach the convergence.\n        Decorator for scikit-learn\
    \ Gaussian Mixture Model attributes.\n        \"\"\"\n        return self.detector_.n_iter_\n\
    \n    @property\n    def lower_bound_(self):\n        \"\"\"Lower bound value\
    \ on the log-likelihood of the best fit of EM.\n        Decorator for scikit-learn\
    \ Gaussian Mixture Model attributes.\n        \"\"\"\n        return self.detector_.lower_bound_\n\
    \n### Source File Dependency Files Content\n### Dependency File: base.py\n# -*-\
    \ coding: utf-8 -*-\n\"\"\"Base class for all outlier detector models\n\"\"\"\n\
    # Author: Yue Zhao <yzhao062@gmail.com>\n# License: BSD 2 clause\n\n\nimport abc\n\
    import warnings\nfrom collections import defaultdict\nfrom inspect import signature\n\
    \nimport numpy as np\nfrom numpy import percentile\nfrom scipy.special import\
    \ erf\nfrom scipy.stats import binom\nfrom sklearn.metrics import roc_auc_score\n\
    from sklearn.preprocessing import MinMaxScaler\nfrom sklearn.utils import deprecated\n\
    from sklearn.utils.multiclass import check_classification_targets\nfrom sklearn.utils.validation\
    \ import check_is_fitted\nfrom scipy.optimize import root_scalar\n\nfrom .sklearn_base\
    \ import _pprint\nfrom ..utils.utility import precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n\
    \    \"\"\"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n\
    \    ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
    \n        # allow arbitrary input such as PyThreshld object\n        self.contamination\
    \ = contamination\n\n    # noinspection PyIncorrectDocstring\n    @abc.abstractmethod\n\
    \    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        pass\n\n    @abc.abstractmethod\n    def\
    \ decision_function(self, X):\n        \"\"\"Predict raw anomaly scores of X using\
    \ the fitted detector.\n\n        The anomaly score of an input sample is computed\
    \ based on the fitted\n        detector. For consistency, outliers are assigned\
    \ with\n        higher anomaly scores.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        pass\n\n    @deprecated()\n    def fit_predict(self,\
    \ X, y=None):\n        \"\"\"Fit detector first and then predict whether a particular\
    \ sample\n        is an outlier or not. y is ignored in unsupervised models.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n\n        .. deprecated:: 0.6.9\n          `fit_predict`\
    \ will be removed in pyod 0.8.0.; it will be\n          replaced by calling `fit`\
    \ function first and then accessing\n          `labels_` attribute for consistency.\n\
    \        \"\"\"\n\n        self.fit(X, y)\n        return self.labels_\n\n   \
    \ def predict(self, X, return_confidence=False):\n        \"\"\"Predict if a particular\
    \ sample is an outlier or not.\n\n        Parameters\n        ----------\n   \
    \     X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        return_confidence : boolean, optional(default=False)\n \
    \           If True, also return the confidence of prediction.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n        confidence : numpy array of shape (n_samples,).\n\
    \            Only if return_confidence is set to True.\n        \"\"\"\n\n   \
    \     check_is_fitted(self, ['decision_scores_', 'threshold_', 'labels_'])\n \
    \       pred_score = self.decision_function(X)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (pred_score > self.threshold_).astype('int').ravel()\n\
    \n        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(pred_score)\n\n        if return_confidence:\n   \
    \         confidence = self.predict_confidence(X)\n            return prediction,\
    \ confidence\n\n        return prediction\n\n    def predict_proba(self, X, method='linear',\
    \ return_confidence=False):\n        \"\"\"Predict the probability of a sample\
    \ being outlier. Two approaches\n        are possible:\n\n        1. simply use\
    \ Min-max conversion to linearly transform the outlier\n           scores into\
    \ the range of [0,1]. The model must be\n           fitted first.\n        2.\
    \ use unifying scores, see :cite:`kriegel2011interpreting`.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The input samples.\n\n        method : str, optional (default='linear')\n\
    \            probability conversion method. It must be one of\n            'linear'\
    \ or 'unify'.\n\n        return_confidence : boolean, optional(default=False)\n\
    \            If True, also return the confidence of prediction.\n\n\n        Returns\n\
    \        -------\n        outlier_probability : numpy array of shape (n_samples,\
    \ n_classes)\n            For each observation, tells whether or not\n       \
    \     it should be considered as an outlier according to the\n            fitted\
    \ model. Return the outlier probability, ranging\n            in [0,1]. Note it\
    \ depends on the number of classes, which is by\n            default 2 classes\
    \ ([proba of normal, proba of outliers]).\n        \"\"\"\n\n        check_is_fitted(self,\
    \ ['decision_scores_', 'threshold_', 'labels_'])\n        train_scores = self.decision_scores_\n\
    \n        test_scores = self.decision_function(X)\n\n        probs = np.zeros([X.shape[0],\
    \ int(self._classes)])\n        if method == 'linear':\n            scaler = MinMaxScaler().fit(train_scores.reshape(-1,\
    \ 1))\n            probs[:, 1] = scaler.transform(\n                test_scores.reshape(-1,\
    \ 1)).ravel().clip(0, 1)\n            probs[:, 0] = 1 - probs[:, 1]\n\n      \
    \      if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n\n    \
    \    elif method == 'unify':\n            # turn output into probability\n   \
    \         pre_erf_score = (test_scores - self._mu) / (\n                    self._sigma\
    \ * np.sqrt(2))\n            erf_score = erf(pre_erf_score)\n            probs[:,\
    \ 1] = erf_score.clip(0, 1).ravel()\n            probs[:, 0] = 1 - probs[:, 1]\n\
    \n            if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n      \
    \  else:\n            raise ValueError(method,\n                             'is\
    \ not a valid probability conversion method')\n\n    def predict_confidence(self,\
    \ X):\n        \"\"\"Predict the model's confidence in making the same prediction\n\
    \        under slightly different training sets.\n        See :cite:`perini2020quantifying`.\n\
    \n        Parameters\n        -------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        Returns\n        -------\n\
    \        confidence : numpy array of shape (n_samples,)\n            For each\
    \ observation, tells how consistently the model would\n            make the same\
    \ prediction if the training set was perturbed.\n            Return a probability,\
    \ ranging in [0,1].\n\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        n = len(self.decision_scores_)\n\n    \
    \    # todo: this has an optimization opportunity since the scores may\n     \
    \   # already be available\n        test_scores = self.decision_function(X)\n\n\
    \        count_instances = np.vectorize(\n            lambda x: np.count_nonzero(self.decision_scores_\
    \ <= x))\n        n_instances = count_instances(test_scores)\n\n        # Derive\
    \ the outlier probability using Bayesian approach\n        posterior_prob = np.vectorize(lambda\
    \ x: (1 + x) / (2 + n))(n_instances)\n\n        if not isinstance(self.contamination,\
    \ (float, int)):\n            contam = np.sum(self.labels_) / n\n        # if\
    \ this is a PyThresh object\n        else:\n            contam = self.contamination\n\
    \n        # Transform the outlier probability into a confidence value\n      \
    \  confidence = np.vectorize(\n            lambda p: 1 - binom.cdf(n - int(n *\
    \ contam), n, p))(\n            posterior_prob)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (test_scores > self.threshold_).astype('int').ravel()\n\
    \        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(test_scores)\n        np.place(confidence, prediction\
    \ == 0, 1 - confidence[prediction == 0])\n\n        return confidence\n\n    def\
    \ predict_with_rejection(self, X, T=32, return_stats=False,\n                \
    \               delta=0.1, c_fp=1, c_fn=1, c_r=-1):\n        \"\"\"Predict if\
    \ a particular sample is an outlier or not, \n           allowing the detector\
    \ to reject (i.e., output = -2) \n           low confidence predictions.\n\n \
    \       Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        T : int, optional(default=32)\n\
    \            It allows to set the rejection threshold to 1-2exp(-T).\n       \
    \     The higher the value of T, the more rejections are made.\n            \n\
    \        return_stats: bool, optional (default = False)\n                    \
    \  If true, it returns also three additional float values:\n                 \
    \     the estimated rejection rate, the upper bound rejection\n              \
    \        rate, and the upper bound of the cost.\n                       \n   \
    \     delta: float, optional (default = 0.1)\n               The upper bound rejection\
    \ rate holds with probability 1-delta.\n                       \n        c_fp,\
    \ c_fn, c_r: floats (positive), optional (default = [1,1, contamination])\n  \
    \                       costs for false positive predictions (c_fp), false negative\n\
    \                         predictions (c_fn) and rejections (c_r).\n         \
    \       \n        Returns\n        -------\n        outlier_labels : numpy array\
    \ of shape (n_samples,)\n                         For each observation, it tells\
    \ whether it should be\n                         considered as an outlier according\
    \ to the fitted\n                         model. 0 stands for inliers, 1 for outliers\
    \ and\n                         -2 for rejection.\n                          \
    \         \n        expected_rejection_rate:   float, if return_stats is True;\n\
    \        upperbound_rejection_rate: float, if return_stats is True;\n        upperbound_cost:\
    \           float, if return_stats is True;\n\n        \"\"\"\n        check_is_fitted(self,\
    \ ['decision_scores_', 'threshold_', 'labels_'])\n        if c_r < 0:\n      \
    \      warnings.warn(\n                \"The cost of rejection must be positive.\
    \ \"\n                \"It has been set to the contamination rate.\")\n      \
    \      c_r = self.contamination\n\n        if delta <= 0 or delta >= 1:\n    \
    \        warnings.warn(\n                \"delta must belong to (0,1). It's value\
    \ has been set to 0.1\")\n            delta = 0.1\n\n        self.rejection_threshold_\
    \ = 1 - 2 * np.exp(-T)\n        prediction = self.predict(X)\n        confidence\
    \ = self.predict_confidence(X)\n        np.place(confidence, prediction == 0,\
    \ 1 - confidence[prediction == 0])\n        confidence = 2 * abs(confidence -\
    \ .5)\n        prediction[np.where(confidence <= self.rejection_threshold_)[0]]\
    \ = -2\n\n        if return_stats:\n            expected_rejrate, ub_rejrate,\
    \ ub_cost = self.compute_rejection_stats(\n                T=T, delta=delta,\n\
    \                c_fp=c_fp, c_fn=c_fn, c_r=c_r)\n            return prediction,\
    \ [expected_rejrate, ub_rejrate, ub_cost]\n\n        return prediction\n\n   \
    \ def compute_rejection_stats(self, T=32, delta=0.1, c_fp=1, c_fn=1, c_r=-1,\n\
    \                                verbose=False):\n        \"\"\"Add reject option\
    \ into the unsupervised detector. \n           This comes with guarantees: an\
    \ estimate of the expected\n           rejection rate (return_rejectrate=True),\
    \ an upper\n           bound of the rejection rate (return_ub_rejectrate= True),\n\
    \           and an upper bound on the cost (return_ub_cost=True).\n          \
    \ \n        Parameters\n        ----------\n        T: int, optional(default=32)\n\
    \           It allows to set the rejection threshold to 1-2exp(-T).\n        \
    \   The higher the value of T, the more rejections are made.\n            \n \
    \       delta: float, optional (default = 0.1)\n               The upper bound\
    \ rejection rate holds with probability 1-delta.\n                       \n  \
    \      c_fp, c_fn, c_r: floats (positive),\n                         optional\
    \ (default = [1,1, contamination])\n                         costs for false positive\
    \ predictions (c_fp),\n                         false negative predictions (c_fn)\
    \ and rejections (c_r).\n                         \n        verbose: bool, optional\
    \ (default = False)\n                 If true, it prints the expected rejection\
    \ rate, the upper\n                 bound rejection rate, and the upper bound\
    \ of the cost.\n\n        Returns\n        -------\n        expected_rejection_rate:\
    \   float, the expected rejection rate;\n        upperbound_rejection_rate: float,\
    \ the upper bound for the rejection rate\n                                   satisfied\
    \ with probability 1-delta;\n        upperbound_cost:           float, the upper\
    \ bound for the cost;\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        if c_r < 0:\n            c_r = self.contamination\n\
    \n        if delta <= 0 or delta >= 1:\n            delta = 0.1\n\n        # Computing\
    \ the expected rejection rate\n        n = len(self.decision_scores_)\n      \
    \  n_gamma_minus1 = int(n * self.contamination) - 1\n        argsmin = (n_gamma_minus1,\
    \ n, 1 - np.exp(-T))\n        argsmax = (n_gamma_minus1, n, np.exp(-T))\n    \
    \    q1 = root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n           \
    \              bracket=[0, 1], method='brentq', args=argsmin).root\n        q2\
    \ = root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n                 \
    \        bracket=[0, 1], method='brentq', args=argsmax).root\n        expected_reject_rate\
    \ = q2 - q1\n\n        # Computing the upper bound for the rejection rate\n  \
    \      right_mar = (-self.contamination * (n + 2) + n + 1) / n + (\n         \
    \           T * (n + 2)) / (np.sqrt(2 * n ** 3 * T))\n        right_mar = min(1,\
    \ right_mar)\n        left_mar = (\n                (2 + n * (1 - self.contamination)\
    \ * (n + 1)) / n ** 2\n                - np.sqrt(\n            0.5 * n ** 5 *\
    \ (\n                    2 * n * (\n                    -3 * self.contamination\
    \ ** 2\n                    - 2 * n * (1 - self.contamination) ** 2\n        \
    \            + 4 * self.contamination - 3\n            )\n                   \
    \ + T * (n + 2) ** 2 - 8\n            )\n        ) / n ** 4\n        )\n     \
    \   left_mar = max(0, left_mar)\n        add_term = 2 * np.sqrt(np.log(2 / delta)\
    \ / (2 * n))\n        upperbound_rejectrate = right_mar - left_mar + add_term\n\
    \n        # Computing the upper bound for the cost function\n        n_gamma_minus1\
    \ = int(n * self.contamination) - 1\n        argsmin = (n_gamma_minus1, n, 1 -\
    \ np.exp(-T))\n        argsmax = (n_gamma_minus1, n, np.exp(-T))\n        q1 =\
    \ root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n                   \
    \      bracket=[0, 1], method='brentq', args=argsmin).root\n        q2 = root_scalar(lambda\
    \ p, k, n, C: binom.cdf(k, n, p) - C,\n                         bracket=[0, 1],\
    \ method='brentq', args=argsmax).root\n        upperbound_cost = np.min([self.contamination,\
    \ q1]) * c_fp + np.min(\n            [1 - q2, self.contamination]) * c_fn + (q2\
    \ - q1) * c_r\n\n        if verbose:\n            print(\"Expected rejection rate:\
    \ \",\n                  np.round(expected_reject_rate, 4), '%')\n           \
    \ print(\"Upper bound rejection rate: \",\n                  np.round(upperbound_rejectrate,\
    \ 4), '%')\n            print(\"Upper bound cost: \", np.round(upperbound_cost,\
    \ 4))\n\n        return expected_reject_rate, upperbound_rejectrate, upperbound_cost\n\
    \n    def _predict_rank(self, X, normalized=False):\n        \"\"\"Predict the\
