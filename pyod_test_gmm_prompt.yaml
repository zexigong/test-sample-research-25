    from sklearn.utils import check_random_state\nfrom sklearn.utils import column_or_1d\n\
    from sklearn.utils.random import sample_without_replacement\n\nMAX_INT = np.iinfo(np.int32).max\n\
    MIN_INT = -1 * MAX_INT\n\n\ndef check_parameter(param, low=MIN_INT, high=MAX_INT,\
    \ param_name='',\n                    include_left=False, include_right=False):\n\
    \    \"\"\"Check if an input is within the defined range.\n\n    Parameters\n\
    \    ----------\n    param : int, float\n        The input parameter to check.\n\
    \n    low : int, float\n        The lower bound of the range.\n\n    high : int,\
    \ float\n        The higher bound of the range.\n\n    param_name : str, optional\
    \ (default='')\n        The name of the parameter.\n\n    include_left : bool,\
    \ optional (default=False)\n        Whether includes the lower bound (lower bound\
    \ <=).\n\n    include_right : bool, optional (default=False)\n        Whether\
    \ includes the higher bound (<= higher bound).\n\n    Returns\n    -------\n \
    \   within_range : bool or raise errors\n        Whether the parameter is within\
    \ the range of (low, high)\n\n    \"\"\"\n\n    # param, low and high should all\
    \ be numerical\n    if not isinstance(param, (numbers.Integral, np.integer, float)):\n\
    \        raise TypeError('{param_name} is set to {param} Not numerical'.format(\n\
    \            param=param, param_name=param_name))\n\n    if not isinstance(low,\
    \ (numbers.Integral, np.integer, float)):\n        raise TypeError('low is set\
    \ to {low}. Not numerical'.format(low=low))\n\n    if not isinstance(high, (numbers.Integral,\
    \ np.integer, float)):\n        raise TypeError('high is set to {high}. Not numerical'.format(\n\
    \            high=high))\n\n    # at least one of the bounds should be specified\n\
    \    if low is MIN_INT and high is MAX_INT:\n        raise ValueError('Neither\
    \ low nor high bounds is undefined')\n\n    # if wrong bound values are used\n\
    \    if low > high:\n        raise ValueError(\n            'Lower bound > Higher\
    \ bound')\n\n    # value check under different bound conditions\n    if (include_left\
    \ and include_right) and (param < low or param > high):\n        raise ValueError(\n\
    \            '{param_name} is set to {param}. '\n            'Not in the range\
    \ of [{low}, {high}].'.format(\n                param=param, low=low, high=high,\
    \ param_name=param_name))\n\n    elif (include_left and not include_right) and\
    \ (\n            param < low or param >= high):\n        raise ValueError(\n \
    \           '{param_name} is set to {param}. '\n            'Not in the range\
    \ of [{low}, {high}).'.format(\n                param=param, low=low, high=high,\
    \ param_name=param_name))\n\n    elif (not include_left and include_right) and\
    \ (\n            param <= low or param > high):\n        raise ValueError(\n \
