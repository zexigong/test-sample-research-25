    # -*- coding: utf-8 -*-\n\"\"\"A set of utility functions to support outlier detection.\n\
    \"\"\"\n# Author: Yue Zhao <zhaoy@cmu.edu>\n# License: BSD 2 clause\n\nfrom __future__\
