- content: You are an AI agent expert in writing unit tests. Your task is to write
    unit tests for the given code files of the repository. Make sure the tests can
    be executed without lint or compile errors.
  role: system
- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_abod\\\
    test_abod.py\nProject Programming Language: python\nTesting Framework: pytest\n\
    ### Source File Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\"\
    \"\"Angle-based Outlier Detector (ABOD)\n\"\"\"\n# Author: Yue Zhao <yzhao062@gmail.com>\n\
    # License: BSD 2 clause\n\n\nimport warnings\nfrom itertools import combinations\n\
    \nimport numpy as np\nfrom numba import njit\nfrom sklearn.neighbors import KDTree\n\
    from sklearn.neighbors import NearestNeighbors\nfrom sklearn.utils import check_array\n\
    from sklearn.utils.validation import check_is_fitted\n\nfrom .base import BaseDetector\n\
    from ..utils.utility import check_parameter\n\n\n@njit\ndef _wcos(curr_pt, a,\
    \ b):  # pragma: no cover\n    \"\"\"Internal function to calculate weighted cosine\
    \ using optimized\n    numba code.\n\n    Parameters\n    ----------\n    curr_pt\
    \ : numpy array of shape (n_samples, n_features)\n        Current sample to be\
    \ calculated.\n\n    a : numpy array of shape (n_samples, n_features)\n      \
    \  Training sample a.\n\n    b : numpy array of shape (n_samples, n_features)\n\
    \        Training sample b.\n\n    Returns\n    -------\n    wcos : float in range\
    \ [-1, 1]\n        Cosine similarity between a-curr_pt and b-curr_pt.\n\n    \"\
    \"\"\n\n    a_curr = a - curr_pt\n    b_curr = b - curr_pt\n\n    # wcos = (<a_curr,\
    \ b_curr>/((|a_curr|*|b_curr|)^2)\n    wcos = np.dot(a_curr, b_curr) / (\n   \
    \         np.linalg.norm(a_curr, 2) ** 2) / (\n                   np.linalg.norm(b_curr,\
    \ 2) ** 2)\n    return wcos\n\n\ndef _calculate_wocs(curr_pt, X, X_ind):\n   \
    \ \"\"\"Calculated the variance of weighted cosine of a point.\n    wcos = (<a_curr,\
    \ b_curr>/((|a_curr|*|b_curr|)^2)\n\n    Parameters\n    ----------\n    curr_pt\
    \ : numpy array, shape (1, n_features)\n        The sample to be calculated.\n\
    \n    X : numpy array of shape (n_samples, n_features)\n        The training dataset.\n\
    \n    X_ind : list\n        The valid index of the training data.\n\n    Returns\n\
    \    -------\n    cos_angle_var : float\n        The variance of cosine angle\n\
    \n    \"\"\"\n    wcos_list = []\n    curr_pair_inds = list(combinations(X_ind,\
    \ 2))\n    for j, (a_ind, b_ind) in enumerate(curr_pair_inds):\n        a = X[a_ind,\
    \ :]\n        b = X[b_ind, :]\n\n        # skip if no angle can be formed\n  \
    \      if np.array_equal(a, curr_pt) or np.array_equal(b, curr_pt):\n        \
    \    continue\n        # add the weighted cosine to the list\n        wcos_list.append(_wcos(curr_pt,\
    \ a, b))\n    return np.var(wcos_list)\n\n\n# noinspection PyPep8Naming\nclass\
    \ ABOD(BaseDetector):\n    \"\"\"ABOD class for Angle-base Outlier Detection.\n\
    \    For an observation, the variance of its weighted cosine scores to all\n \
    \   neighbors could be viewed as the outlying score.\n    See :cite:`kriegel2008angle`\
    \ for details.\n\n    Two version of ABOD are supported:\n\n    - Fast ABOD: use\
    \ k nearest neighbors to approximate.\n    - Original ABOD: consider all training\
    \ points with high time complexity at\n      O(n^3).\n\n    Parameters\n    ----------\n\
    \    contamination : float in (0., 0.5), optional (default=0.1)\n        The amount\
    \ of contamination of the data set, i.e.\n        the proportion of outliers in\
    \ the data set. Used when fitting to\n        define the threshold on the decision\
    \ function.\n\n    n_neighbors : int, optional (default=10)\n        Number of\
    \ neighbors to use by default for k neighbors queries.\n\n    method: str, optional\
    \ (default='fast')\n        Valid values for metric are:\n\n        - 'fast':\
    \ fast ABOD. Only consider n_neighbors of training points\n        - 'default':\
    \ original ABOD with all training points, which could be\n          slow\n\n \
    \   Attributes\n    ----------\n    decision_scores_ : numpy array of shape (n_samples,)\n\
    \        The outlier scores of the training data.\n        The higher, the more\
    \ abnormal. Outliers tend to have higher\n        scores. This value is available\
    \ once the detector is\n        fitted.\n\n    threshold_ : float\n        The\
    \ threshold is based on ``contamination``. It is the\n        ``n_samples * contamination``\
    \ most abnormal samples in\n        ``decision_scores_``. The threshold is calculated\
    \ for generating\n        binary outlier labels.\n\n    labels_ : int, either\
    \ 0 or 1\n        The binary labels of the training data. 0 stands for inliers\n\
    \        and 1 for outliers/anomalies. It is generated by applying\n        ``threshold_``\
    \ on ``decision_scores_``.\n    \"\"\"\n\n    def __init__(self, contamination=0.1,\
    \ n_neighbors=5, method='fast'):\n        super(ABOD, self).__init__(contamination=contamination)\n\
    \        self.method = method\n        self.n_neighbors = n_neighbors\n\n    def\
    \ fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        # validate inputs X and y (optional)\n \
    \       X = check_array(X)\n        self._set_n_classes(y)\n\n        self.X_train_\
    \ = X\n        self.n_train_ = X.shape[0]\n        self.decision_scores_ = np.zeros([self.n_train_,\
    \ 1])\n\n        if self.method == 'fast':\n            self._fit_fast()\n   \
    \     elif self.method == 'default':\n            self._fit_default()\n      \
    \  else:\n            raise ValueError(self.method, \"is not a valid method\"\
    )\n\n        # flip the scores\n        self.decision_scores_ = self.decision_scores_.ravel()\
    \ * -1\n        self._process_decision_scores()\n        return self\n\n    def\
    \ _fit_default(self):\n        \"\"\"Default ABOD method. Use all training points\
    \ with high complexity\n        O(n^3). For internal use only.\n        \"\"\"\
    \n        for i in range(self.n_train_):\n            curr_pt = self.X_train_[i,\
    \ :]\n\n            # get the index pairs of the neighbors, remove itself from\
    \ index\n            X_ind = list(range(0, self.n_train_))\n            X_ind.remove(i)\n\
    \n            self.decision_scores_[i, 0] = _calculate_wocs(curr_pt,\n       \
    \                                                   self.X_train_,\n         \
    \                                                 X_ind)\n        return self\n\
    \n    def _fit_fast(self):\n        \"\"\"Fast ABOD method. Only use n_neighbors\
    \ for angle calculation.\n        Internal use only\n        \"\"\"\n\n      \
    \  # make sure the n_neighbors is in the range\n        if self.n_neighbors >=\
    \ self.n_train_:\n            self.n_neighbors = self.n_train_ - 1\n         \
    \   warnings.warn(\"n_neighbors is set to the number of \"\n                 \
    \         \"training points minus 1: {0}\".format(self.n_train_))\n\n        \
    \    check_parameter(self.n_neighbors, 1, self.n_train_,\n                   \
    \         include_left=True, include_right=True)\n\n        self.tree_ = KDTree(self.X_train_)\n\
    \n        neigh = NearestNeighbors(n_neighbors=self.n_neighbors)\n        neigh.fit(self.X_train_)\n\
    \        ind_arr = neigh.kneighbors(n_neighbors=self.n_neighbors,\n          \
    \                         return_distance=False)\n\n        for i in range(self.n_train_):\n\
    \            curr_pt = self.X_train_[i, :]\n            X_ind = ind_arr[i, :]\n\
    \            self.decision_scores_[i, 0] = _calculate_wocs(curr_pt,\n        \
    \                                                  self.X_train_,\n          \
    \                                                X_ind)\n        return self\n\
    \n    # noinspection PyPep8Naming\n    def decision_function(self, X):\n     \
    \   \"\"\"Predict raw anomaly score of X using the fitted detector.\n\n      \
    \  The anomaly score of an input sample is computed based on different\n     \
    \   detector algorithms. For consistency, outliers are assigned with\n       \
    \ larger anomaly scores.\n\n        Parameters\n        ----------\n        X\
    \ : numpy array of shape (n_samples, n_features)\n            The training input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n\n        check_is_fitted(self, ['X_train_', 'n_train_',\
    \ 'decision_scores_',\n                               'threshold_', 'labels_'])\n\
    \        X = check_array(X)\n\n        if self.method == 'fast':  # fast ABOD\n\
    \            # outliers have higher outlier scores\n            return self._decision_function_fast(X)\
    \ * -1\n        else:  # default ABOD\n            return self._decision_function_default(X)\
    \ * -1\n\n    def _decision_function_default(self, X):\n        \"\"\"Internal\
    \ method for predicting outlier scores using default ABOD.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The training input samples.\n\n        Returns\n        -------\n\
    \        pred_score : array, shape (n_samples,)\n            The anomaly score\
    \ of the input samples.\n\n        \"\"\"\n        # initialize the output score\n\
    \        pred_score = np.zeros([X.shape[0], 1])\n\n        for i in range(X.shape[0]):\n\
    \            curr_pt = X[i, :]\n            # get the index pairs of the neighbors\n\
    \            X_ind = list(range(0, self.n_train_))\n            pred_score[i,\
    \ :] = _calculate_wocs(curr_pt, self.X_train_, X_ind)\n\n        return pred_score.ravel()\n\
    \n    def _decision_function_fast(self, X):\n        \"\"\"Internal method for\
    \ predicting outlier scores using Fast ABOD.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The training\
    \ input samples.\n\n        Returns\n        -------\n        pred_score : array,\
    \ shape (n_samples,)\n            The anomaly score of the input samples.\n\n\
    \        \"\"\"\n\n        check_is_fitted(self, ['tree_'])\n        # initialize\
    \ the output score\n        pred_score = np.zeros([X.shape[0], 1])\n\n       \
    \ # get the indexes of the X's k nearest training points\n        _, ind_arr =\
    \ self.tree_.query(X, k=self.n_neighbors)\n\n        for i in range(X.shape[0]):\n\
    \            curr_pt = X[i, :]\n            X_ind = ind_arr[i, :]\n          \
    \  pred_score[i, :] = _calculate_wocs(curr_pt, self.X_train_, X_ind)\n\n     \
    \   return pred_score.ravel()\n\n### Source File Dependency Files Content\n###\
    \ Dependency File: base.py\n# -*- coding: utf-8 -*-\n\"\"\"Base class for all\
    \ outlier detector models\n\"\"\"\n# Author: Yue Zhao <yzhao062@gmail.com>\n#\
    \ License: BSD 2 clause\n\n\nimport abc\nimport warnings\nfrom collections import\
    \ defaultdict\nfrom inspect import signature\n\nimport numpy as np\nfrom numpy\
    \ import percentile\nfrom scipy.special import erf\nfrom scipy.stats import binom\n\
    from sklearn.metrics import roc_auc_score\nfrom sklearn.preprocessing import MinMaxScaler\n\
    from sklearn.utils import deprecated\nfrom sklearn.utils.multiclass import check_classification_targets\n\
    from sklearn.utils.validation import check_is_fitted\nfrom scipy.optimize import\
    \ root_scalar\n\nfrom .sklearn_base import _pprint\nfrom ..utils.utility import\
    \ precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n    \"\"\
    \"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n \
    \   ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
    \n        # allow arbitrary input such as PyThreshld object\n        self.contamination\
    \ = contamination\n\n    # noinspection PyIncorrectDocstring\n    @abc.abstractmethod\n\
    \    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        pass\n\n    @abc.abstractmethod\n    def\
    \ decision_function(self, X):\n        \"\"\"Predict raw anomaly scores of X using\
    \ the fitted detector.\n\n        The anomaly score of an input sample is computed\
    \ based on the fitted\n        detector. For consistency, outliers are assigned\
    \ with\n        higher anomaly scores.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        pass\n\n    @deprecated()\n    def fit_predict(self,\
    \ X, y=None):\n        \"\"\"Fit detector first and then predict whether a particular\
    \ sample\n        is an outlier or not. y is ignored in unsupervised models.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n\n        .. deprecated:: 0.6.9\n          `fit_predict`\
    \ will be removed in pyod 0.8.0.; it will be\n          replaced by calling `fit`\
    \ function first and then accessing\n          `labels_` attribute for consistency.\n\
    \        \"\"\"\n\n        self.fit(X, y)\n        return self.labels_\n\n   \
    \ def predict(self, X, return_confidence=False):\n        \"\"\"Predict if a particular\
    \ sample is an outlier or not.\n\n        Parameters\n        ----------\n   \
    \     X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        return_confidence : boolean, optional(default=False)\n \
    \           If True, also return the confidence of prediction.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n        confidence : numpy array of shape (n_samples,).\n\
    \            Only if return_confidence is set to True.\n        \"\"\"\n\n   \
    \     check_is_fitted(self, ['decision_scores_', 'threshold_', 'labels_'])\n \
    \       pred_score = self.decision_function(X)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (pred_score > self.threshold_).astype('int').ravel()\n\
    \n        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(pred_score)\n\n        if return_confidence:\n   \
    \         confidence = self.predict_confidence(X)\n            return prediction,\
    \ confidence\n\n        return prediction\n\n    def predict_proba(self, X, method='linear',\
    \ return_confidence=False):\n        \"\"\"Predict the probability of a sample\
    \ being outlier. Two approaches\n        are possible:\n\n        1. simply use\
    \ Min-max conversion to linearly transform the outlier\n           scores into\
    \ the range of [0,1]. The model must be\n           fitted first.\n        2.\
    \ use unifying scores, see :cite:`kriegel2011interpreting`.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The input samples.\n\n        method : str, optional (default='linear')\n\
    \            probability conversion method. It must be one of\n            'linear'\
    \ or 'unify'.\n\n        return_confidence : boolean, optional(default=False)\n\
    \            If True, also return the confidence of prediction.\n\n\n        Returns\n\
    \        -------\n        outlier_probability : numpy array of shape (n_samples,\
    \ n_classes)\n            For each observation, tells whether or not\n       \
    \     it should be considered as an outlier according to the\n            fitted\
    \ model. Return the outlier probability, ranging\n            in [0,1]. Note it\
    \ depends on the number of classes, which is by\n            default 2 classes\
    \ ([proba of normal, proba of outliers]).\n        \"\"\"\n\n        check_is_fitted(self,\
    \ ['decision_scores_', 'threshold_', 'labels_'])\n        train_scores = self.decision_scores_\n\
    \n        test_scores = self.decision_function(X)\n\n        probs = np.zeros([X.shape[0],\
    \ int(self._classes)])\n        if method == 'linear':\n            scaler = MinMaxScaler().fit(train_scores.reshape(-1,\
    \ 1))\n            probs[:, 1] = scaler.transform(\n                test_scores.reshape(-1,\
    \ 1)).ravel().clip(0, 1)\n            probs[:, 0] = 1 - probs[:, 1]\n\n      \
    \      if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n\n    \
    \    elif method == 'unify':\n            # turn output into probability\n   \
    \         pre_erf_score = (test_scores - self._mu) / (\n                    self._sigma\
    \ * np.sqrt(2))\n            erf_score = erf(pre_erf_score)\n            probs[:,\
    \ 1] = erf_score.clip(0, 1).ravel()\n            probs[:, 0] = 1 - probs[:, 1]\n\
    \n            if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n      \
    \  else:\n            raise ValueError(method,\n                             'is\
    \ not a valid probability conversion method')\n\n    def predict_confidence(self,\
    \ X):\n        \"\"\"Predict the model's confidence in making the same prediction\n\
    \        under slightly different training sets.\n        See :cite:`perini2020quantifying`.\n\
    \n        Parameters\n        -------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        Returns\n        -------\n\
    \        confidence : numpy array of shape (n_samples,)\n            For each\
    \ observation, tells how consistently the model would\n            make the same\
    \ prediction if the training set was perturbed.\n            Return a probability,\
    \ ranging in [0,1].\n\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        n = len(self.decision_scores_)\n\n    \
    \    # todo: this has an optimization opportunity since the scores may\n     \
    \   # already be available\n        test_scores = self.decision_function(X)\n\n\
    \        count_instances = np.vectorize(\n            lambda x: np.count_nonzero(self.decision_scores_\
    \ <= x))\n        n_instances = count_instances(test_scores)\n\n        # Derive\
    \ the outlier probability using Bayesian approach\n        posterior_prob = np.vectorize(lambda\
    \ x: (1 + x) / (2 + n))(n_instances)\n\n        if not isinstance(self.contamination,\
    \ (float, int)):\n            contam = np.sum(self.labels_) / n\n        # if\
    \ this is a PyThresh object\n        else:\n            contam = self.contamination\n\
    \n        # Transform the outlier probability into a confidence value\n      \
    \  confidence = np.vectorize(\n            lambda p: 1 - binom.cdf(n - int(n *\
    \ contam), n, p))(\n            posterior_prob)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (test_scores > self.threshold_).astype('int').ravel()\n\
    \        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(test_scores)\n        np.place(confidence, prediction\
    \ == 0, 1 - confidence[prediction == 0])\n\n        return confidence\n\n    def\
    \ predict_with_rejection(self, X, T=32, return_stats=False,\n                \
    \               delta=0.1, c_fp=1, c_fn=1, c_r=-1):\n        \"\"\"Predict if\
    \ a particular sample is an outlier or not, \n           allowing the detector\
    \ to reject (i.e., output = -2) \n           low confidence predictions.\n\n \
    \       Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        T : int, optional(default=32)\n\
    \            It allows to set the rejection threshold to 1-2exp(-T).\n       \
    \     The higher the value of T, the more rejections are made.\n            \n\
    \        return_stats: bool, optional (default = False)\n                    \
    \  If true, it returns also three additional float values:\n                 \
    \     the estimated rejection rate, the upper bound rejection\n              \
    \        rate, and the upper bound of the cost.\n                       \n   \
    \     delta: float, optional (default = 0.1)\n               The upper bound rejection\
    \ rate holds with probability 1-delta.\n                       \n        c_fp,\
    \ c_fn, c_r: floats (positive), optional (default = [1,1, contamination])\n  \
    \                       costs for false positive predictions (c_fp), false negative\n\
    \                         predictions (c_fn) and rejections (c_r).\n         \
    \       \n        Returns\n        -------\n        outlier_labels : numpy array\
    \ of shape (n_samples,)\n                         For each observation, it tells\
    \ whether it should be\n                         considered as an outlier according\
    \ to the fitted\n                         model. 0 stands for inliers, 1 for outliers\
    \ and\n                         -2 for rejection.\n                          \
    \         \n        expected_rejection_rate:   float, if return_stats is True;\n\
    \        upperbound_rejection_rate: float, if return_stats is True;\n        upperbound_cost:\
    \           float, if return_stats is True;\n\n        \"\"\"\n        check_is_fitted(self,\
    \ ['decision_scores_', 'threshold_', 'labels_'])\n        if c_r < 0:\n      \
    \      warnings.warn(\n                \"The cost of rejection must be positive.\
    \ \"\n                \"It has been set to the contamination rate.\")\n      \
    \      c_r = self.contamination\n\n        if delta <= 0 or delta >= 1:\n    \
    \        warnings.warn(\n                \"delta must belong to (0,1). It's value\
    \ has been set to 0.1\")\n            delta = 0.1\n\n        self.rejection_threshold_\
    \ = 1 - 2 * np.exp(-T)\n        prediction = self.predict(X)\n        confidence\
    \ = self.predict_confidence(X)\n        np.place(confidence, prediction == 0,\
