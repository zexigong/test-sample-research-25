    \ def compute_rejection_stats(self, T=32, delta=0.1, c_fp=1, c_fn=1, c_r=-1,\n\
    \                                verbose=False):\n        \"\"\"Add reject option\
    \ into the unsupervised detector. \n           This comes with guarantees: an\
