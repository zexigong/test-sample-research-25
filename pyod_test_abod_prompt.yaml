    \ np.exp(-T))\n        argsmax = (n_gamma_minus1, n, np.exp(-T))\n        q1 =\
    \ root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n                   \
    \      bracket=[0, 1], method='brentq', args=argsmin).root\n        q2 = root_scalar(lambda\
