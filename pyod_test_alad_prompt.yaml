    \           It allows to set the rejection threshold to 1-2exp(-T).\n        \
    \   The higher the value of T, the more rejections are made.\n            \n \
    \       delta: float, optional (default = 0.1)\n               The upper bound\
    \ rejection rate holds with probability 1-delta.\n                       \n  \
    \      c_fp, c_fn, c_r: floats (positive),\n                         optional\
    \ (default = [1,1, contamination])\n                         costs for false positive\
    \ predictions (c_fp),\n                         false negative predictions (c_fn)\
    \ and rejections (c_r).\n                         \n        verbose: bool, optional\
    \ (default = False)\n                 If true, it prints the expected rejection\
    \ rate, the upper\n                 bound rejection rate, and the upper bound\
    \ of the cost.\n\n        Returns\n        -------\n        expected_rejection_rate:\
    \   float, the expected rejection rate;\n        upperbound_rejection_rate: float,\
    \ the upper bound for the rejection rate\n                                   satisfied\
    \ with probability 1-delta;\n        upperbound_cost:           float, the upper\
    \ bound for the cost;\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        if c_r < 0:\n            c_r = self.contamination\n\
    \n        if delta <= 0 or delta >= 1:\n            delta = 0.1\n\n        # Computing\
    \ the expected rejection rate\n        n = len(self.decision_scores_)\n      \
    \  n_gamma_minus1 = int(n * self.contamination) - 1\n        argsmin = (n_gamma_minus1,\
    \ n, 1 - np.exp(-T))\n        argsmax = (n_gamma_minus1, n, np.exp(-T))\n    \
    \    q1 = root_scalar(lambda p, k, n, C: binom.cdf(k, n, p) - C,\n           \
    \              bracket=[0, 1], method='brentq', args=argsmin).root\n        q2\
