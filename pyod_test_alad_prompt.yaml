    \ + '__' + k, val) for k, val in deep_items)\n            out[key] = value\n \
    \       return out\n\n    def set_params(self, **params):\n        # noinspection\
    \ PyPep8\n        \"\"\"Set the parameters of this estimator.\n        The method\
    \ works on simple estimators as well as on nested objects\n        (such as pipelines).\
