    \  If set to True, all ranks are normalized to [0,1].\n\n        Returns\n   \
    \     -------\n        ranks : array, shape (n_samples,)\n            Outlying\
    \ rank of a sample according to the training data.\n\n        \"\"\"\n\n     \
    \   check_is_fitted(self, ['decision_scores_'])\n\n        test_scores = self.decision_function(X)\n\
    \        train_scores = self.decision_scores_\n\n        sorted_train_scores =\
    \ np.sort(train_scores)\n        ranks = np.searchsorted(sorted_train_scores,\
    \ test_scores)\n\n        if normalized:\n            # return normalized ranks\n\
    \            ranks = ranks / ranks.max()\n        return ranks\n\n    @deprecated()\n\
