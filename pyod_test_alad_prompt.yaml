- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_alad\\\
    test_alad.py\nProject Programming Language: python\nTesting Framework: pytest\n\
    ### Source File Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\"\
    \"\"Using Adversarially Learned Anomaly Detection\n\"\"\"\n# Author: Michiel Bongaerts\
    \ (but not author of the ALAD method)\n# Pytorch version Author: Jiaqi Li <jli77629@usc.edu>\n\
    \n\nimport numpy as np\nimport pandas as pd\n\ntry:\n    import torch\nexcept\
    \ ImportError:\n    print('please install torch first')\n\nimport torch\nimport\
    \ torch.nn as nn\nimport torch.optim as optim\nfrom matplotlib import pyplot as\
    \ plt\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.utils import\
    \ check_array\nfrom sklearn.utils.validation import check_is_fitted\n\nfrom .base\
    \ import BaseDetector\nfrom ..utils.utility import check_parameter\n\n\nclass\
    \ ALAD(BaseDetector):\n    \"\"\"Adversarially Learned Anomaly Detection (ALAD).\
    \ \n    Paper: https://arxiv.org/pdf/1812.02288.pdf\n\n    See :cite:`zenati2018adversarially`\
    \ for details.\n    \n    Parameters\n    ----------\n    output_activation :\
    \ str, optional (default=None)\n        Activation function to use for output\
    \ layers for encoder and dector.\n\n    activation_hidden_disc : str, optional\
    \ (default='tanh')\n        Activation function to use for hidden layers in discrimators.\n\
    \n    activation_hidden_gen : str, optional (default='tanh')\n        Activation\
    \ function to use for hidden layers in encoder and decoder\n        (i.e. generator).\n\
    \n    epochs : int, optional (default=500)\n        Number of epochs to train\
    \ the model.\n\n    batch_size : int, optional (default=32)\n        Number of\
    \ samples per gradient update.\n\n    dropout_rate : float in (0., 1), optional\
    \ (default=0.2)\n        The dropout to be used across all layers.\n\n    dec_layers\
    \ : list, optional (default=[5,10,25])\n        List that indicates the number\
    \ of nodes per hidden layer for the d\n        ecoder network.\n        Thus,\
    \ [10,10] indicates 2 hidden layers having each 10 nodes.\n\n    enc_layers :\
    \ list, optional (default=[25,10,5])\n        List that indicates the number of\
    \ nodes per hidden layer for the\n        encoder network.\n        Thus, [10,10]\
    \ indicates 2 hidden layers having each 10 nodes.\n\n    disc_xx_layers : list,\
    \ optional (default=[25,10,5])\n        List that indicates the number of nodes\
    \ per hidden layer for\n        discriminator_xx.\n        Thus, [10,10] indicates\
    \ 2 hidden layers having each 10 nodes.\n\n    disc_zz_layers : list, optional\
    \ (default=[25,10,5])\n        List that indicates the number of nodes per hidden\
    \ layer for\n        discriminator_zz.\n        Thus, [10,10] indicates 2 hidden\
    \ layers having each 10 nodes.\n\n    disc_xz_layers : list, optional (default=[25,10,5])\n\
    \        List that indicates the number of nodes per hidden layer for\n      \
    \  discriminator_xz.\n        Thus, [10,10] indicates 2 hidden layers having each\
    \ 10 nodes.\n\n    learning_rate_gen: float in (0., 1), optional (default=0.001)\n\
    \        learning rate of training the encoder and decoder\n\n    learning_rate_disc:\
    \ float in (0., 1), optional (default=0.001)\n        learning rate of training\
    \ the discriminators\n\n    add_recon_loss: bool optional (default=False)\n  \
    \      add an extra loss for encoder and decoder based on the reconstruction\n\
    \        error\n\n    lambda_recon_loss: float in (0., 1), optional (default=0.1)\n\
    \        if ``add_recon_loss= True``, the reconstruction loss gets multiplied\n\
    \        by ``lambda_recon_loss`` and added to the total loss for the generator\n\
    \         (i.e. encoder and decoder).\n\n    preprocessing : bool, optional (default=True)\n\
    \        If True, apply standardization on the data.\n\n    verbose : int, optional\
    \ (default=1)\n        Verbosity mode.\n        - 0 = silent\n        - 1 = progress\
    \ bar\n\n    contamination : float in (0., 0.5), optional (default=0.1)\n    \
    \    The amount of contamination of the data set, i.e.\n        the proportion\
    \ of outliers in the data set. When fitting this is used\n        to define the\
    \ threshold on the decision function.\n\n    device : str or None, optional (default=None)\n\
    \        The device to use for computation. If None, the default device will be\
    \ used.\n        Possible values include 'cpu' or 'gpu'. This parameter allows\
    \ the user\n        to specify the preferred device for running the model.\n \
    \       \n    Attributes\n    ----------\n    decision_scores_ : numpy array of\
    \ shape (n_samples,)\n        The outlier scores of the training data [0,1].\n\
    \        The higher, the more abnormal. Outliers tend to have higher\n       \
    \ scores. This value is available once the detector is\n        fitted.\n\n  \
    \  threshold_ : float\n        The threshold is based on ``contamination``. It\
    \ is the\n        ``n_samples * contamination`` most abnormal samples in\n   \
    \     ``decision_scores_``. The threshold is calculated for generating\n     \
    \   binary outlier labels.\n\n    labels_ : int, either 0 or 1\n        The binary\
    \ labels of the training data. 0 stands for inliers\n        and 1 for outliers/anomalies.\
    \ It is generated by applying\n        ``threshold_`` on ``decision_scores_``.\n\
    \    \"\"\"\n\n    def __init__(self, activation_hidden_gen='tanh',\n        \
    \         activation_hidden_disc='tanh',\n                 output_activation=None,\n\
    \                 dropout_rate=0.2,\n                 latent_dim=2,\n        \
    \         dec_layers=[5, 10, 25],\n                 enc_layers=[25, 10, 5],\n\
    \                 disc_xx_layers=[25, 10, 5],\n                 disc_zz_layers=[25,\
    \ 10, 5],\n                 disc_xz_layers=[25, 10, 5],\n                 learning_rate_gen=0.0001,\
    \ learning_rate_disc=0.0001,\n                 add_recon_loss=False, lambda_recon_loss=0.1,\n\
    \                 epochs=200,\n                 verbose=0,\n                 preprocessing=False,\n\
    \                 add_disc_zz_loss=True, spectral_normalization=False,\n     \
    \            batch_size=32, contamination=0.1, device=None):\n        super(ALAD,\
    \ self).__init__(contamination=contamination)\n\n        self.device = device\
    \ if device else torch.device(\n            \"cuda\" if torch.cuda.is_available()\
    \ else \"cpu\")\n        self.activation_hidden_disc = activation_hidden_disc\n\
    \        self.activation_hidden_gen = activation_hidden_gen\n        self.output_activation\
    \ = output_activation\n        self.dropout_rate = dropout_rate\n        self.latent_dim\
    \ = latent_dim\n        self.dec_layers = dec_layers\n        self.enc_layers\
    \ = enc_layers\n\n        self.disc_xx_layers = disc_xx_layers\n        self.disc_zz_layers\
    \ = disc_zz_layers\n        self.disc_xz_layers = disc_xz_layers\n\n        self.add_recon_loss\
    \ = add_recon_loss\n        self.lambda_recon_loss = lambda_recon_loss\n     \
    \   self.add_disc_zz_loss = add_disc_zz_loss\n\n        self.contamination = contamination\n\
    \        self.epochs = epochs\n        self.learning_rate_gen = learning_rate_gen\n\
    \        self.learning_rate_disc = learning_rate_disc\n        self.preprocessing\
    \ = preprocessing\n        self.batch_size = batch_size\n        self.verbose\
    \ = verbose\n        self.spectral_normalization = spectral_normalization\n\n\
    \        if self.spectral_normalization:\n            try:\n                import\
    \ torch.nn.utils.spectral_norm as spectral_norm\n                self.spectral_norm\
    \ = spectral_norm\n            except ImportError:\n                print('Spectral\
    \ normalization not available. '\n                      'Install torch>=1.0.0.')\n\
    \                self.spectral_normalization = False\n\n        check_parameter(dropout_rate,\
    \ 0, 1, param_name='dropout_rate',\n                        include_left=True)\n\
    \n    def _build_model(self):\n        def get_activation(name):\n           \
    \ if name == 'tanh':\n                return nn.Tanh()\n            elif name\
    \ == 'sigmoid':\n                return nn.Sigmoid()\n            elif name ==\
    \ 'relu':\n                return nn.ReLU()\n            else:\n             \
    \   raise ValueError(\n                    \"Unsupported activation function:\
    \ {}\".format(name))\n\n        # Create the decoder\n        dec_layers = []\n\
    \        input_dim = self.latent_dim\n        for l_dim in self.dec_layers:\n\
    \            dec_layers.append(nn.Linear(input_dim, l_dim))\n            dec_layers.append(nn.Dropout(self.dropout_rate))\n\
    \            dec_layers.append(get_activation(self.activation_hidden_gen))\n \
    \           input_dim = l_dim\n        dec_layers.append(nn.Linear(input_dim,\
    \ self.n_features_))\n        if self.output_activation:\n            dec_layers.append(get_activation(self.output_activation))\n\
    \        self.dec = nn.Sequential(*dec_layers).to(self.device)\n\n        # Create\
    \ the encoder\n        enc_layers = []\n        input_dim = self.n_features_\n\
    \        for l_dim in self.enc_layers:\n            enc_layers.append(nn.Linear(input_dim,\
    \ l_dim))\n            enc_layers.append(nn.Dropout(self.dropout_rate))\n    \
    \        enc_layers.append(get_activation(self.activation_hidden_gen))\n     \
    \       input_dim = l_dim\n        enc_layers.append(nn.Linear(input_dim, self.latent_dim))\n\
    \        if self.output_activation:\n            enc_layers.append(get_activation(self.output_activation))\n\
    \        self.enc = nn.Sequential(*enc_layers).to(self.device)\n\n        # Create\
    \ the discriminators\n        def create_discriminator(layers, input_dim):\n \
    \           disc_layers = []\n            for l_dim in layers:\n             \
    \   disc_layers.append(nn.Linear(input_dim, l_dim))\n                if self.spectral_normalization:\n\
    \                    disc_layers[-1] = nn.utils.spectral_norm(disc_layers[-1])\n\
    \                disc_layers.append(nn.Dropout(self.dropout_rate))\n         \
    \       disc_layers.append(get_activation(self.activation_hidden_disc))\n    \
    \            input_dim = l_dim\n            disc_layers.append(nn.Linear(input_dim,\
    \ 1))\n            disc_layers.append(nn.Sigmoid())\n            return nn.Sequential(*disc_layers).to(self.device)\n\
    \n        self.disc_xx = create_discriminator(self.disc_xx_layers,\n         \
    \                                   2 * self.n_features_)\n        self.disc_zz\
    \ = create_discriminator(self.disc_zz_layers,\n                              \
    \              2 * self.latent_dim)\n        self.disc_xz = create_discriminator(self.disc_xz_layers,\n\
    \                                            self.n_features_ + self.latent_dim)\n\
    \n        # Optimizers\n        self.opt_gen = optim.Adam(\n            list(self.enc.parameters())\
    \ + list(self.dec.parameters()),\n            lr=self.learning_rate_gen)\n   \
    \     self.opt_disc = optim.Adam(list(self.disc_xx.parameters()) + list(\n   \
    \         self.disc_xz.parameters()) + list(self.disc_zz.parameters()),\n    \
    \                               lr=self.learning_rate_disc)\n\n        self.hist_loss_disc\
    \ = []\n        self.hist_loss_gen = []\n\n    def train_step(self, data):\n \
    \       x_real, z_real = data\n\n        x_real = torch.FloatTensor(x_real).to(self.device)\n\
    \        z_real = torch.FloatTensor(z_real).to(self.device)\n\n        self.opt_disc.zero_grad()\n\
    \        x_gen = self.dec(z_real)\n        z_gen = self.enc(x_real)\n\n      \
    \  out_true_xz = self.disc_xz(torch.cat((x_real, z_gen), dim=1))\n        out_fake_xz\
    \ = self.disc_xz(torch.cat((x_gen, z_real), dim=1))\n\n        out_true_xx = self.disc_xx(torch.cat((x_real,\
    \ x_real), dim=1))\n        out_fake_xx = self.disc_xx(torch.cat((x_real, x_gen),\
    \ dim=1))\n\n        loss_dxz = nn.BCELoss()(out_true_xz,\n                  \
    \              torch.ones_like(out_true_xz)) + nn.BCELoss()(\n            out_fake_xz,\
    \ torch.zeros_like(out_fake_xz))\n        loss_dxx = nn.BCELoss()(out_true_xx,\n\
    \                                torch.ones_like(out_true_xx)) + nn.BCELoss()(\n\
    \            out_fake_xx, torch.zeros_like(out_fake_xx))\n\n        if self.add_disc_zz_loss:\n\
    \            out_true_zz = self.disc_zz(torch.cat((z_real, z_real), dim=1))\n\
    \            out_fake_zz = self.disc_zz(torch.cat((z_real, z_gen), dim=1))\n \
    \           loss_dzz = nn.BCELoss()(out_true_zz, torch.ones_like(\n          \
    \      out_true_zz)) + nn.BCELoss()(out_fake_zz,\n                           \
    \                  torch.zeros_like(out_fake_zz))\n            loss_disc = loss_dxz\
    \ + loss_dzz + loss_dxx\n        else:\n            loss_disc = loss_dxz + loss_dxx\n\
    \n        loss_disc.backward()\n        self.opt_disc.step()\n\n        self.opt_gen.zero_grad()\n\
    \        x_gen = self.dec(z_real)\n        z_gen = self.enc(x_real)\n\n      \
    \  out_true_xz = self.disc_xz(torch.cat((x_real, z_gen), dim=1))\n        out_fake_xz\
    \ = self.disc_xz(torch.cat((x_gen, z_real), dim=1))\n\n        out_true_xx = self.disc_xx(torch.cat((x_real,\
    \ x_real), dim=1))\n        out_fake_xx = self.disc_xx(torch.cat((x_real, x_gen),\
    \ dim=1))\n\n        loss_gexz = nn.BCELoss()(out_fake_xz,\n                 \
    \                torch.ones_like(out_fake_xz)) + nn.BCELoss()(\n            out_true_xz,\
    \ torch.zeros_like(out_true_xz))\n        loss_gexx = nn.BCELoss()(out_fake_xx,\n\
    \                                 torch.ones_like(out_fake_xx)) + nn.BCELoss()(\n\
    \            out_true_xx, torch.zeros_like(out_true_xx))\n\n        if self.add_disc_zz_loss:\n\
    \            out_true_zz = self.disc_zz(torch.cat((z_real, z_real), dim=1))\n\
    \            out_fake_zz = self.disc_zz(torch.cat((z_real, z_gen), dim=1))\n \
    \           loss_gezz = nn.BCELoss()(out_fake_zz, torch.ones_like(\n         \
    \       out_fake_zz)) + nn.BCELoss()(out_true_zz,\n                          \
    \                   torch.zeros_like(out_true_zz))\n            cycle_consistency\
    \ = loss_gezz + loss_gexx\n            loss_gen = loss_gexz + cycle_consistency\n\
    \        else:\n            cycle_consistency = loss_gexx\n            loss_gen\
    \ = loss_gexz + cycle_consistency\n\n        if self.add_recon_loss:\n       \
    \     x_recon = self.dec(self.enc(x_real))\n            loss_recon = torch.mean((x_real\
    \ - x_recon) ** 2)\n            loss_gen += loss_recon * self.lambda_recon_loss\n\
    \n        loss_gen.backward()\n        self.opt_gen.step()\n\n        self.hist_loss_disc.append(loss_disc.item())\n\
    \        self.hist_loss_gen.append(loss_gen.item())\n\n    def fit(self, X, y=None,\
    \ noise_std=0.1):\n        \"\"\"Fit detector. y is ignored in unsupervised methods.\n\
    \        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n        y : Ignored\n         \
    \   Not used, present for API consistency by convention.\n        Returns\n  \
    \      -------\n        self : object\n            Fitted estimator.\n       \
    \ \"\"\"\n        # validate inputs X and y (optional)\n        X = check_array(X)\n\
    \        self._set_n_classes(y)\n\n        # Get number of sampels and features\
    \ from train set\n        self.n_samples_, self.n_features_ = X.shape[0], X.shape[1]\n\
    \        self._build_model()\n\n        # Apply data scaling or not\n        if\
    \ self.preprocessing:\n            self.scaler_ = StandardScaler()\n         \
    \   X_norm = self.scaler_.fit_transform(X)\n        else:\n            X_norm\
    \ = np.copy(X)\n\n        for n in range(self.epochs):\n            if n % 50\
    \ == 0 and n != 0 and self.verbose == 1:\n                print(f'Train iter:\
    \ {n}')\n\n            # Shuffle train \n            np.random.shuffle(X_norm)\n\
    \n            X_train_sel = X_norm[\n                          :min(self.batch_size,\
    \ self.n_samples_)].astype(\n                np.float32)\n            latent_noise\
    \ = np.random.normal(0, 1, (\n                X_train_sel.shape[0], self.latent_dim))\n\
    \            X_train_sel += np.random.normal(0, noise_std,\n                 \
    \                           size=X_train_sel.shape)\n            self.train_step((X_train_sel,\
    \ latent_noise))\n\n        if self.preprocessing:\n            X_norm = self.scaler_.transform(X)\n\
    \        else:\n            X_norm = np.copy(X)\n\n        pred_scores = self.get_outlier_scores(X_norm)\n\
    \        self.decision_scores_ = pred_scores\n        self._process_decision_scores()\n\
    \        return self\n\n    def train_more(self, X, epochs=100, noise_std=0.1):\n\
    \        \"\"\"This function allows the researcher to perform extra training\n\
    \        instead of the fixed number determined\n        by the fit() function.\n\
    \        \"\"\"\n        # fit() should have been called first\n        check_is_fitted(self,\
    \ ['decision_scores_'])\n\n        # Apply data scaling or not\n        if self.preprocessing:\n\
    \            X_norm = self.scaler_.transform(X)\n        else:\n            X_norm\
    \ = np.copy(X)\n\n        for n in range(epochs):\n            if n % 50 == 0\
    \ and n != 0 and self.verbose == 1:\n                print(f'Train iter: {n}')\n\
    \n            # Shuffle train \n            np.random.shuffle(X_norm)\n\n    \
    \        X_train_sel = X_norm[\n                          :min(self.batch_size,\
    \ self.n_samples_)].astype(\n                np.float32)\n            latent_noise\
    \ = np.random.normal(0, 1, (\n                X_train_sel.shape[0], self.latent_dim))\n\
    \            X_train_sel += np.random.normal(0, noise_std,\n                 \
    \                           size=X_train_sel.shape)\n            self.train_step((X_train_sel,\
    \ latent_noise))\n\n        if self.preprocessing:\n            X_norm = self.scaler_.transform(X)\n\
    \        else:\n            X_norm = np.copy(X)\n\n        pred_scores = self.get_outlier_scores(X_norm)\n\
    \        self.decision_scores_ = pred_scores\n        self._process_decision_scores()\n\
    \        return self\n\n    def get_outlier_scores(self, X_norm):\n        X_norm\
    \ = torch.FloatTensor(X_norm).to(self.device)\n        X_enc = self.enc(X_norm).detach().cpu().numpy()\n\
    \        X_enc_gen = self.dec(\n            torch.FloatTensor(X_enc).to(self.device)).detach().cpu().numpy()\n\
    \n        out_true_xx = self.disc_xx(\n            torch.cat((X_norm, X_norm),\
    \ dim=1)).detach().cpu().numpy()\n        out_fake_xx = self.disc_xx(\n      \
    \      torch.cat((X_norm, torch.FloatTensor(X_enc_gen).to(self.device)),\n   \
    \                   dim=1)).detach().cpu().numpy()\n\n        outlier_scores =\
    \ np.mean(np.abs((out_true_xx - out_fake_xx) ** 2),\n                        \
    \         axis=1)\n        return outlier_scores\n\n    def decision_function(self,\
    \ X):\n        \"\"\"Predict raw anomaly score of X using the fitted detector.\n\
    \        The anomaly score of an input sample is computed based on different\n\
    \        detector algorithms. For consistency, outliers are assigned with\n  \
    \      larger anomaly scores.\n        Parameters\n        ----------\n      \
    \  X : numpy array of shape (n_samples, n_features)\n            The training\
    \ input samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        check_is_fitted(self, ['decision_scores_'])\n\
    \        X = check_array(X)\n\n        if self.preprocessing:\n            X_norm\
    \ = self.scaler_.transform(X)\n        else:\n            X_norm = np.copy(X)\n\
    \n        X_norm = torch.FloatTensor(X_norm).to(self.device)\n        pred_scores\
    \ = self.get_outlier_scores(X_norm.cpu().numpy())\n        return pred_scores\n\
    \n    def plot_learning_curves(self, start_ind=0, window_smoothening=10):\n  \
    \      fig = plt.figure(figsize=(12, 5))\n\n        l_gen = pd.Series(self.hist_loss_gen[start_ind:]).rolling(\n\
    \            window=window_smoothening).mean()\n        l_disc = pd.Series(self.hist_loss_disc[start_ind:]).rolling(\n\
    \            window=window_smoothening).mean()\n\n        ax = fig.add_subplot(1,\
    \ 2, 1)\n        ax.plot(range(len(l_gen)), l_gen)\n        ax.set_title('Generator')\n\
    \        ax.set_ylabel('Loss')\n        ax.set_xlabel('Iter')\n\n        ax =\
    \ fig.add_subplot(1, 2, 2)\n        ax.plot(range(len(l_disc)), l_disc)\n    \
    \    ax.set_title('Discriminator(s)')\n        ax.set_ylabel('Loss')\n       \
    \ ax.set_xlabel('Iter')\n\n        plt.show()\n\n### Source File Dependency Files\
    \ Content\n### Dependency File: base.py\n# -*- coding: utf-8 -*-\n\"\"\"Base class\
    \ for all outlier detector models\n\"\"\"\n# Author: Yue Zhao <yzhao062@gmail.com>\n\
    # License: BSD 2 clause\n\n\nimport abc\nimport warnings\nfrom collections import\
    \ defaultdict\nfrom inspect import signature\n\nimport numpy as np\nfrom numpy\
    \ import percentile\nfrom scipy.special import erf\nfrom scipy.stats import binom\n\
    from sklearn.metrics import roc_auc_score\nfrom sklearn.preprocessing import MinMaxScaler\n\
    from sklearn.utils import deprecated\nfrom sklearn.utils.multiclass import check_classification_targets\n\
    from sklearn.utils.validation import check_is_fitted\nfrom scipy.optimize import\
    \ root_scalar\n\nfrom .sklearn_base import _pprint\nfrom ..utils.utility import\
    \ precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n    \"\"\
    \"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n \
    \   ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
