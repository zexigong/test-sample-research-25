- content: You are an AI agent expert in writing unit tests. Your task is to write
    unit tests for the given code files of the repository. Make sure the tests can
    be executed without lint or compile errors.
  role: system
- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_devnet\\\
    test_devnet.py\nProject Programming Language: python\nTesting Framework: pytest\n\
    ### Source File Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\n\
    \"\"\"Deep anomaly detection with deviation networks\nPart of the codes are adapted\
    \ from\nhttps://github.com/GuansongPang/deviation-network\n\"\"\"\n# Author: Sihan\
    \ Chen <schen976@usc.edu>\n# License: BSD 2 clause\n\n\n# Import necessary libraries\n\
    import numpy as np\nimport torch\nimport torch.nn as nn\nimport torch.optim as\
    \ optim\nfrom sklearn.utils import check_array\nfrom torch.utils.data import Dataset,\
    \ DataLoader\n\nfrom .base import BaseDetector\nfrom ..utils.torch_utility import\
    \ TorchDataset\n\nMAX_INT = np.iinfo(np.int32).max\ndata_format = 0\n\n# Set random\
    \ seed for reproducibility\nnp.random.seed(42)\ntorch.manual_seed(42)\n\n\n# Define\
    \ the network architectures\nclass DevNetD(nn.Module):\n    def __init__(self,\
    \ input_shape):\n        super(DevNetD, self).__init__()\n        self.fc1 = nn.Linear(input_shape,\
    \ 1000)\n        self.fc2 = nn.Linear(1000, 250)\n        self.fc3 = nn.Linear(250,\
    \ 20)\n        self.score = nn.Linear(20, 1)\n\n    def forward(self, x):\n  \
    \      x = torch.relu(self.fc1(x))\n        x = torch.relu(self.fc2(x))\n    \
    \    x = torch.relu(self.fc3(x))\n        x = self.score(x)\n        return x\n\
    \n\nclass DevNetS(nn.Module):\n    def __init__(self, input_shape):\n        super(DevNetS,\
    \ self).__init__()\n        self.fc1 = nn.Linear(input_shape, 1000)\n        self.score\
    \ = nn.Linear(1000, 1)\n\n    def forward(self, x):\n        x = torch.relu(self.fc1(x))\n\
    \        x = self.score(x)\n        return x\n\n\nclass DevNetLinear(nn.Module):\n\
    \    def __init__(self, input_shape):\n        super(DevNetLinear, self).__init__()\n\
    \        self.score = nn.Linear(input_shape, 1)\n\n    def forward(self, x):\n\
    \        x = self.score(x)\n        return x\n\n\ndef deviation_loss(y_true, y_pred):\n\
    \    '''\n    Z-score-based deviation loss translated to PyTorch.\n    '''\n \
    \   confidence_margin = 5.0\n    # size=5000 is the setting of l in algorithm\
    \ 1 in the paper\n    ref = torch.randn(5000, device=y_pred.device,\n        \
    \              dtype=torch.float32)  # Generate normal distributed ref values\n\
    \    dev = (y_pred - ref.mean()) / ref.std()\n    inlier_loss = torch.abs(dev)\n\
    \    outlier_loss = torch.abs(torch.clamp(confidence_margin - dev, min=0))\n\n\
    \    # Compute the mean of the weighted sum of inlier and outlier losses\n   \
    \ return torch.mean((1 - y_true) * inlier_loss + y_true * outlier_loss)\n\n\n\
    # Define the training and testing process\ndef train_and_test(model, train_loader,\
    \ test_loader, epochs, device):\n    criterion = nn.MSELoss()\n    optimizer =\
    \ optim.Adam(model.parameters(), lr=0.001)\n    model.train()\n\n    for epoch\
    \ in range(epochs):\n        for inputs, labels in train_loader:\n           \
    \ inputs, labels = inputs.to(device), labels.to(device)\n            optimizer.zero_grad()\n\
    \            outputs = model(inputs)\n            loss = criterion(outputs, labels)\n\
    \            loss.backward()\n            optimizer.step()\n\n    model.eval()\n\
    \    with torch.no_grad():\n        total_loss = 0\n        for inputs, labels\
    \ in test_loader:\n            inputs, labels = inputs.to(device), labels.to(device)\n\
    \            outputs = model(inputs)\n            total_loss += criterion(outputs,\
    \ labels).item()\n        print('Test Loss:', total_loss / len(test_loader))\n\
    \n\n# Main function to run the model\ndef deviation_network(input_shape, network_depth):\n\
    \    '''\n    Construct the deviation network-based detection model in PyTorch\
    \ style\n    '''\n    # Select the model based on the network depth\n    if network_depth\
    \ == 4:\n        model = DevNetD(input_shape)\n    elif network_depth == 2:\n\
    \        model = DevNetS(input_shape)\n    elif network_depth == 1:\n        model\
    \ = DevNetLinear(input_shape)\n    else:\n        raise ValueError(\n        \
    \    \"The network depth is not set properly\")  # Use exception instead of sys.exit\n\
    \n    # Initialize the optimizer\n    optimizer = optim.RMSprop(model.parameters(),\
    \ lr=0.001,\n                              weight_decay=1e-6)  # Set clipnorm\
    \ equivalent in PyTorch\n    return model, optimizer\n\n\nclass SupDataset(Dataset):\n\
    \    def __init__(self, x, outlier_indices, inlier_indices, rng):\n        self.x\
    \ = x\n        self.outlier_indices = outlier_indices\n        self.inlier_indices\
    \ = inlier_indices\n        self.rng = np.random.RandomState(\n            42)\
    \  # Ensure rng is seeded outside or fixed\n\n    def __len__(self):\n       \
    \ return len(self.outlier_indices) + len(\n            self.inlier_indices)  #\
    \ or any other appropriate length\n\n    def __getitem__(self, idx):\n       \
    \ if idx < len(self.inlier_indices):\n            # Assuming inliers are processed\
    \ first\n            label = 0  # Assuming inlier label\n            index = self.inlier_indices[idx]\n\
    \        else:\n            # Processing outliers\n            label = 1  # Assuming\
    \ outlier label\n            index = self.outlier_indices[idx - len(self.inlier_indices)]\n\
    \n        return self.x[index], label\n\n\ndef input_batch_generation_sup_sparse(x_train,\
    \ outlier_indices, inlier_indices,\n                                      batch_size,\
    \ rng):\n    '''\n    Batch generation for samples, alternating between positive\
    \ and negative.\n    Adjusted for use with PyTorch, handling data in tensors.\n\
    \    '''\n    training_data = []\n    training_labels = []\n    n_inliers = len(inlier_indices)\n\
    \    n_outliers = len(outlier_indices)\n\n    for i in range(batch_size):\n  \
    \      if i % 2 == 0:\n            sid = rng.choice(n_inliers, 1)\n          \
    \  training_data.append(x_train[inlier_indices[sid.item()]])\n            training_labels.append(0)\n\
    \        else:\n            sid = rng.choice(n_outliers, 1)\n            training_data.append(x_train[outlier_indices[sid.item()]])\n\
    \            training_labels.append(1)\n\n    # Convert lists to tensors\n   \
    \ training_data = torch.stack(training_data)\n    training_labels = torch.tensor(training_labels,\
    \ dtype=torch.long)\n\n    return training_data, training_labels\n\n\ndef load_model_weight_predict(model,\
    \ x_test):\n    # Ensure x_test is a PyTorch tensor and also ensure it's on the\
    \ same device as the model\n    x_test = torch.tensor(x_test, dtype=torch.float32)\n\
    \n    # Assuming data_format variable should be defined somewhere in the context\
    \ or as a parameter\n    data_format = 0  # Assuming it's set correctly according\
    \ to your use-case\n\n    if data_format == 0:\n        scores = model(x_test)\n\
    \    else:\n        data_size = x_test.shape[0]\n        scores = torch.zeros([data_size,\
    \ ])\n        batch_size = 512\n        for i in range(0, data_size, batch_size):\n\
    \            end = min(i + batch_size, data_size)\n            subset = x_test[i:end]\n\
    \            scores[i:end] = model(subset)\n\n    # Make sure the output is flattened\
    \ before returning\n    scores = scores.flatten()  # Flatten the tensor to ensure\
    \ it's one-dimensional\n\n    return scores.detach().cpu().numpy()  # Convert\
    \ to numpy array if needed\n\n\nclass DevNet(BaseDetector):\n    def __init__(self,\n\
    \                 network_depth=2,\n                 batch_size=512,\n       \
    \          epochs=50,\n                 nb_batch=20,\n                 known_outliers=30,\n\
    \                 cont_rate=0.02,\n                 data_format=0,  # Assuming\
    \ '0' for CSV\n                 random_seed=42,\n                 device=None,\n\
    \                 contamination=0.1):\n        super(DevNet, self).__init__(contamination=contamination)\n\
    \        self._classes = 2\n        self.network_depth = network_depth\n     \
    \   self.batch_size = batch_size\n        self.epochs = epochs\n        self.nb_batch\
    \ = nb_batch\n        self.known_outliers = known_outliers\n        self.cont_rate\
    \ = cont_rate\n        self.data_format = data_format\n        self.random_seed\
    \ = random_seed\n        self.device = device\n        if self.device is None:\n\
    \            self.device = torch.device(\n                \"cuda:0\" if torch.cuda.is_available()\
    \ else \"cpu\")\n\n    def fit(self, X, y):\n        outlier_indices = np.where(y\
    \ == 1)[0]\n        inlier_indices = np.where(y == 0)[0]\n        n_outliers =\
    \ len(outlier_indices)\n        print(\"Original training size: %d, No. outliers:\
    \ %d\" % (\n            X.shape[0], n_outliers))\n        n_noise = len(np.where(y\
    \ == 0)[0]) * self.contamination / (\n                1. - self.contamination)\n\
    \        n_noise = int(n_noise)\n        outlier_indices = np.where(y == 1)[0]\n\
    \        inlier_indices = np.where(y == 0)[0]\n        print(y.shape[0], outlier_indices.shape[0],\
    \ inlier_indices.shape[0],\n              n_noise)\n        # Data manipulation\
    \ part can be adjusted as needed.\n        self.model, optimizer = deviation_network(X.shape[1],\n\
    \                                                  self.network_depth)\n     \
    \   rng = np.random.RandomState(42)\n        train_dataset = SupDataset(X, outlier_indices,\
    \ inlier_indices, rng)\n        train_loader = DataLoader(train_dataset, batch_size=self.batch_size,\n\
    \                                  shuffle=True)\n\n        def train_model(model,\
    \ data_loader, epochs):\n            model.train()\n            for epoch in range(epochs):\n\
    \                for data, labels in data_loader:\n                    data, labels\
    \ = data.to(torch.float32), labels.to(\n                        torch.float32)\
    \  # Ensure data types\n                    optimizer.zero_grad()\n          \
    \          outputs = model(data)\n                    loss = deviation_loss(outputs,\
    \ labels)\n                    loss.backward()\n                    optimizer.step()\n\
    \                print(f'Epoch {epoch + 1}, Loss: {loss.item()}')\n\n        #\
    \ Training the model\n        train_model(self.model, train_loader, epochs=self.epochs)\n\
    \        self.decision_scores_ = self.decision_function(X)\n        self._process_decision_scores()\n\
    \        return self\n\n    def decision_function(self, X):\n        X = check_array(X)\n\
    \n        dataset = TorchDataset(X=X, return_idx=True)\n\n        dataloader =\
    \ torch.utils.data.DataLoader(dataset,\n                                     \
    \            batch_size=self.batch_size,\n                                   \
    \              shuffle=False)\n        # enable the evaluation mode\n        self.model.eval()\n\
    \n        # construct the vector for holding the reconstruction error\n      \
    \  outlier_scores = np.zeros([X.shape[0], ])\n        with torch.no_grad():\n\
    \            for data, data_idx in dataloader:\n                data_cuda = data.to(self.device).float()\n\
    \                # this is the outlier score\n                outlier_scores[data_idx]\
    \ = load_model_weight_predict(\n                    self.model, data)\n      \
    \  return outlier_scores\n\n    def fit_predict_score(self, X, y, scoring='roc_auc_score'):\n\
    \        \"\"\"\n        Fit the detector with labels, predict on samples, and\
    \ evaluate the model by predefined metrics.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n        y : numpy array of shape (n_samples,)\n            The labels\
    \ or target values corresponding to X.\n        scoring : str, optional (default='roc_auc_score')\n\
    \            Evaluation metric:\n            - 'roc_auc_score': ROC score\n  \
    \          - 'prc_n_score': Precision @ rank n score\n\n        Returns\n    \
    \    -------\n        score : float\n        \"\"\"\n\n        # Fit the model\
    \ with both X and y\n        self.fit(X, y)\n\n        # Prediction and scoring\n\
    \        if scoring == 'roc_auc_score':\n            from sklearn.metrics import\
    \ roc_auc_score\n            score = roc_auc_score(y, self.decision_scores_)\n\
    \        elif scoring == 'prc_n_score':\n            from sklearn.metrics import\
    \ precision_recall_curve\n            precision, _, _ = precision_recall_curve(y,\
    \ self.decision_scores_)\n            score = precision[\n                1] \
    \ # Assuming this is how you'd compute Precision @ rank n\n        else:\n   \
    \         raise NotImplementedError('PyOD built-in scoring only supports '\n \
    \                                     'ROC and Precision @ rank n')\n\n      \
    \  print(\"{metric}: {score}\".format(metric=scoring, score=score))\n\n      \
    \  return score\n\n### Source File Dependency Files Content\n### Dependency File:\
    \ base.py\n# -*- coding: utf-8 -*-\n\"\"\"Base class for all outlier detector\
    \ models\n\"\"\"\n# Author: Yue Zhao <yzhao062@gmail.com>\n# License: BSD 2 clause\n\
    \n\nimport abc\nimport warnings\nfrom collections import defaultdict\nfrom inspect\
    \ import signature\n\nimport numpy as np\nfrom numpy import percentile\nfrom scipy.special\
    \ import erf\nfrom scipy.stats import binom\nfrom sklearn.metrics import roc_auc_score\n\
    from sklearn.preprocessing import MinMaxScaler\nfrom sklearn.utils import deprecated\n\
    from sklearn.utils.multiclass import check_classification_targets\nfrom sklearn.utils.validation\
    \ import check_is_fitted\nfrom scipy.optimize import root_scalar\n\nfrom .sklearn_base\
    \ import _pprint\nfrom ..utils.utility import precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n\
    \    \"\"\"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n\
    \    ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
    \n        # allow arbitrary input such as PyThreshld object\n        self.contamination\
    \ = contamination\n\n    # noinspection PyIncorrectDocstring\n    @abc.abstractmethod\n\
    \    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        pass\n\n    @abc.abstractmethod\n    def\
    \ decision_function(self, X):\n        \"\"\"Predict raw anomaly scores of X using\
    \ the fitted detector.\n\n        The anomaly score of an input sample is computed\
    \ based on the fitted\n        detector. For consistency, outliers are assigned\
    \ with\n        higher anomaly scores.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        pass\n\n    @deprecated()\n    def fit_predict(self,\
    \ X, y=None):\n        \"\"\"Fit detector first and then predict whether a particular\
    \ sample\n        is an outlier or not. y is ignored in unsupervised models.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n\n        .. deprecated:: 0.6.9\n          `fit_predict`\
    \ will be removed in pyod 0.8.0.; it will be\n          replaced by calling `fit`\
    \ function first and then accessing\n          `labels_` attribute for consistency.\n\
    \        \"\"\"\n\n        self.fit(X, y)\n        return self.labels_\n\n   \
    \ def predict(self, X, return_confidence=False):\n        \"\"\"Predict if a particular\
    \ sample is an outlier or not.\n\n        Parameters\n        ----------\n   \
    \     X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        return_confidence : boolean, optional(default=False)\n \
    \           If True, also return the confidence of prediction.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n        confidence : numpy array of shape (n_samples,).\n\
    \            Only if return_confidence is set to True.\n        \"\"\"\n\n   \
    \     check_is_fitted(self, ['decision_scores_', 'threshold_', 'labels_'])\n \
    \       pred_score = self.decision_function(X)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (pred_score > self.threshold_).astype('int').ravel()\n\
    \n        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(pred_score)\n\n        if return_confidence:\n   \
    \         confidence = self.predict_confidence(X)\n            return prediction,\
    \ confidence\n\n        return prediction\n\n    def predict_proba(self, X, method='linear',\
    \ return_confidence=False):\n        \"\"\"Predict the probability of a sample\
    \ being outlier. Two approaches\n        are possible:\n\n        1. simply use\
    \ Min-max conversion to linearly transform the outlier\n           scores into\
    \ the range of [0,1]. The model must be\n           fitted first.\n        2.\
    \ use unifying scores, see :cite:`kriegel2011interpreting`.\n\n        Parameters\n\
    \        ----------\n        X : numpy array of shape (n_samples, n_features)\n\
    \            The input samples.\n\n        method : str, optional (default='linear')\n\
    \            probability conversion method. It must be one of\n            'linear'\
    \ or 'unify'.\n\n        return_confidence : boolean, optional(default=False)\n\
    \            If True, also return the confidence of prediction.\n\n\n        Returns\n\
    \        -------\n        outlier_probability : numpy array of shape (n_samples,\
    \ n_classes)\n            For each observation, tells whether or not\n       \
    \     it should be considered as an outlier according to the\n            fitted\
    \ model. Return the outlier probability, ranging\n            in [0,1]. Note it\
    \ depends on the number of classes, which is by\n            default 2 classes\
    \ ([proba of normal, proba of outliers]).\n        \"\"\"\n\n        check_is_fitted(self,\
    \ ['decision_scores_', 'threshold_', 'labels_'])\n        train_scores = self.decision_scores_\n\
    \n        test_scores = self.decision_function(X)\n\n        probs = np.zeros([X.shape[0],\
    \ int(self._classes)])\n        if method == 'linear':\n            scaler = MinMaxScaler().fit(train_scores.reshape(-1,\
    \ 1))\n            probs[:, 1] = scaler.transform(\n                test_scores.reshape(-1,\
    \ 1)).ravel().clip(0, 1)\n            probs[:, 0] = 1 - probs[:, 1]\n\n      \
    \      if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n\n    \
    \    elif method == 'unify':\n            # turn output into probability\n   \
    \         pre_erf_score = (test_scores - self._mu) / (\n                    self._sigma\
    \ * np.sqrt(2))\n            erf_score = erf(pre_erf_score)\n            probs[:,\
    \ 1] = erf_score.clip(0, 1).ravel()\n            probs[:, 0] = 1 - probs[:, 1]\n\
    \n            if return_confidence:\n                confidence = self.predict_confidence(X)\n\
    \                return probs, confidence\n\n            return probs\n      \
    \  else:\n            raise ValueError(method,\n                             'is\
    \ not a valid probability conversion method')\n\n    def predict_confidence(self,\
    \ X):\n        \"\"\"Predict the model's confidence in making the same prediction\n\
    \        under slightly different training sets.\n        See :cite:`perini2020quantifying`.\n\
    \n        Parameters\n        -------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        Returns\n        -------\n\
    \        confidence : numpy array of shape (n_samples,)\n            For each\
    \ observation, tells how consistently the model would\n            make the same\
    \ prediction if the training set was perturbed.\n            Return a probability,\
    \ ranging in [0,1].\n\n        \"\"\"\n\n        check_is_fitted(self, ['decision_scores_',\
    \ 'threshold_', 'labels_'])\n\n        n = len(self.decision_scores_)\n\n    \
    \    # todo: this has an optimization opportunity since the scores may\n     \
    \   # already be available\n        test_scores = self.decision_function(X)\n\n\
    \        count_instances = np.vectorize(\n            lambda x: np.count_nonzero(self.decision_scores_\
    \ <= x))\n        n_instances = count_instances(test_scores)\n\n        # Derive\
    \ the outlier probability using Bayesian approach\n        posterior_prob = np.vectorize(lambda\
    \ x: (1 + x) / (2 + n))(n_instances)\n\n        if not isinstance(self.contamination,\
    \ (float, int)):\n            contam = np.sum(self.labels_) / n\n        # if\
    \ this is a PyThresh object\n        else:\n            contam = self.contamination\n\
    \n        # Transform the outlier probability into a confidence value\n      \
    \  confidence = np.vectorize(\n            lambda p: 1 - binom.cdf(n - int(n *\
    \ contam), n, p))(\n            posterior_prob)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (test_scores > self.threshold_).astype('int').ravel()\n\
    \        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(test_scores)\n        np.place(confidence, prediction\
    \ == 0, 1 - confidence[prediction == 0])\n\n        return confidence\n\n    def\
    \ predict_with_rejection(self, X, T=32, return_stats=False,\n                \
    \               delta=0.1, c_fp=1, c_fn=1, c_r=-1):\n        \"\"\"Predict if\
    \ a particular sample is an outlier or not, \n           allowing the detector\
    \ to reject (i.e., output = -2) \n           low confidence predictions.\n\n \
    \       Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        T : int, optional(default=32)\n\
    \            It allows to set the rejection threshold to 1-2exp(-T).\n       \
