    \ = y_dtype\n        self.return_idx = return_idx\n\n    def __len__(self):\n\
    \        return len(self.X)\n\n    def __getitem__(self, idx):\n        if torch.is_tensor(idx):\n\
    \            idx = idx.tolist()\n        sample = self.X[idx, :]\n\n        if\
