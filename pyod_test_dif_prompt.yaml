  role: system
- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: pyod\nTest File Path: pyod\\test_dif\\test_dif.py\n\
    Project Programming Language: python\nTesting Framework: pytest\n### Source File\
    \ Content\n### Source File Content:\n# -*- coding: utf-8 -*-\n\"\"\"Deep Isolation\
    \ Forest for Anomaly Detection (DIF)\n\"\"\"\n# Author: Hongzuo Xu <hongzuoxu@126.edu>\n\
    # License: BSD 2 clause\n\n\nimport numpy as np\n\ntry:\n    import torch\nexcept\
    \ ImportError:\n    print('please install torch first')\n\nimport torch\nfrom\
    \ torch.utils.data import DataLoader\n\nfrom sklearn.utils import check_array\n\
    from sklearn.utils.validation import check_is_fitted\nfrom sklearn.ensemble import\
    \ IsolationForest\nfrom sklearn.preprocessing import StandardScaler, MinMaxScaler\n\
    \nfrom .base import BaseDetector\nfrom ..utils.torch_utility import get_activation_by_name\n\
    \n\nclass DIF(BaseDetector):\n    \"\"\"Deep Isolation Forest (DIF) is an extension\
    \ of iForest. It uses deep\n    representation ensemble to achieve non-linear\
    \ isolation on original data\n    space. See :cite:`xu2023dif` for details.\n\n\
    \    Parameters\n    ----------\n    batch_size : int, optional (default=1000)\n\
    \        Number of samples per gradient update.\n\n    representation_dim, int,\
    \ optional (default=20)\n        Dimensionality of the representation space.\n\
    \n    hidden_neurons, list, optional (default=[64, 32])\n        The number of\
    \ neurons per hidden layers. So the network has the\n        structure as [n_features,\
    \ hidden_neurons[0], hidden_neurons[1], ..., representation_dim]\n\n    hidden_activation,\
    \ str, optional (default='tanh')\n        Activation function to use for hidden\
    \ layers.\n        All hidden layers are forced to use the same type of activation.\n\
    \        See https://pytorch.org/docs/stable/nn.html for details.\n        Currently\
    \ only\n        'relu': nn.ReLU()\n        'sigmoid': nn.Sigmoid()\n        'tanh':\
    \ nn.Tanh()\n        are supported. See pyod/utils/torch_utility.py for details.\n\
    \n    skip_connection, boolean, optional (default=False)\n        If True, apply\
    \ skip-connection in the neural network structure.\n\n    n_ensemble, int, optional\
    \ (default=50)\n        The number of deep representation ensemble members.\n\n\
    \    n_estimators, int, optional (default=6)\n        The number of isolation\
    \ forest of each representation.\n\n    max_samples, int, optional (default=256)\n\
    \        The number of samples to draw from X to train each base isolation tree.\n\
    \n    contamination : float in (0., 0.5), optional (default=0.1)\n        The\
    \ amount of contamination of the data set,\n        i.e. the proportion of outliers\
    \ in the data set. Used when fitting to\n        define the threshold on the decision\
    \ function.\n\n    random_state : int or None, optional (default=None)\n     \
    \   If int, random_state is the seed used by the random\n        number generator;\n\
    \        If None, the random number generator is the\n        RandomState instance\
    \ used by `np.random`.\n\n    device, 'cuda', 'cpu', or None, optional (default=None)\n\
    \        if 'cuda', use GPU acceleration in torch\n        if 'cpu', use cpu in\
    \ torch\n        if None, automatically determine whether GPU is available\n\n\
    \n    Attributes\n    ----------\n    net_lst : list of torch.Module\n       \
    \ The list of representation neural networks.\n\n    iForest_lst : list of iForest\n\
    \        The list of instantiated iForest model.\n\n    x_reduced_lst: list of\
    \ numpy array\n        The list of training data representations\n\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    def __init__(self,\n                 batch_size=1000,\n                 representation_dim=20,\n\
    \                 hidden_neurons=None,\n                 hidden_activation='tanh',\n\
    \                 skip_connection=False,\n                 n_ensemble=50,\n  \
    \               n_estimators=6,\n                 max_samples=256,\n         \
    \        contamination=0.1,\n                 random_state=None,\n           \
    \      device=None):\n        super(DIF, self).__init__(contamination=contamination)\n\
    \        self.batch_size = batch_size\n        self.representation_dim = representation_dim\n\
    \        self.hidden_activation = hidden_activation\n        self.skip_connection\
    \ = skip_connection\n        self.hidden_neurons = hidden_neurons\n\n        self.n_ensemble\
    \ = n_ensemble\n        self.n_estimators = n_estimators\n        self.max_samples\
    \ = max_samples\n\n        self.random_state = random_state\n        self.device\
    \ = device\n\n        self.minmax_scaler = None\n\n        # create default calculation\
    \ device (support GPU if available)\n        if self.device is None:\n       \
    \     self.device = torch.device(\n                \"cuda:0\" if torch.cuda.is_available()\
    \ else \"cpu\")\n\n        # set random seed\n        if self.random_state is\
    \ not None:\n            torch.manual_seed(self.random_state)\n            torch.cuda.manual_seed(self.random_state)\n\
    \            torch.cuda.manual_seed_all(self.random_state)\n            np.random.seed(self.random_state)\n\
    \n        # default values for the amount of hidden neurons\n        if self.hidden_neurons\
    \ is None:\n            self.hidden_neurons = [500, 100]\n\n    def fit(self,\
    \ X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised methods.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        self : object\n            Fitted estimator.\n     \
    \   \"\"\"\n        # validate inputs X and y (optional)\n        X = check_array(X)\n\
    \        self._set_n_classes(y)\n\n        n_samples, n_features = X.shape[0],\
    \ X.shape[1]\n\n        # conduct min-max normalization before feeding into neural\
    \ networks\n        self.minmax_scaler = MinMaxScaler()\n        self.minmax_scaler.fit(X)\n\
    \        X = self.minmax_scaler.transform(X)\n\n        # prepare neural network\
    \ parameters\n        network_params = {\n            'n_features': n_features,\n\
    \            'n_hidden': self.hidden_neurons,\n            'n_output': self.representation_dim,\n\
    \            'activation': self.hidden_activation,\n            'skip_connection':\
    \ self.skip_connection\n        }\n\n        # iteration\n        self.net_lst\
    \ = []\n        self.iForest_lst = []\n        self.x_reduced_lst = []\n     \
    \   ensemble_seeds = np.random.randint(0, 100000, self.n_ensemble)\n        for\
    \ i in range(self.n_ensemble):\n            # instantiate network class and seed\
    \ random seed\n            net = MLPnet(**network_params).to(self.device)\n  \
    \          torch.manual_seed(ensemble_seeds[i])\n\n            # initialize network\
    \ parameters\n            for name, param in net.named_parameters():\n       \
    \         if name.endswith('weight'):\n                    torch.nn.init.normal_(param,\
    \ mean=0., std=1.)\n\n            x_reduced = self._deep_representation(net, X)\n\
    \n            # save network and representations\n            self.x_reduced_lst.append(x_reduced)\n\
    \            self.net_lst.append(net)\n\n            # perform iForest upon representations\n\
    \            self.iForest_lst.append(\n                IsolationForest(n_estimators=self.n_estimators,\n\
    \                                max_samples=self.max_samples,\n             \
    \                   random_state=ensemble_seeds[i])\n            )\n         \
    \   self.iForest_lst[i].fit(x_reduced)\n\n        self.decision_scores_ = self.decision_function(X)\n\
    \        self._process_decision_scores()\n        return self\n\n    def decision_function(self,\
    \ X):\n        \"\"\"Predict raw anomaly score of X using the fitted detector.\n\
    \n        The anomaly score of an input sample is computed based on different\n\
    \        detector algorithms. For consistency, outliers are assigned with\n  \
    \      larger anomaly scores.\n\n        Parameters\n        ----------\n    \
    \    X : numpy array of shape (n_samples, n_features)\n            The training\
    \ input samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        check_is_fitted(self, ['net_lst', 'iForest_lst',\
    \ 'x_reduced_lst'])\n        X = check_array(X)\n\n        # conduct min-max normalization\
    \ before feeding into neural networks\n        X = self.minmax_scaler.transform(X)\n\
    \n        testing_n_samples = X.shape[0]\n        score_lst = np.zeros([self.n_ensemble,\
    \ testing_n_samples])\n\n        # iteration\n        for i in range(self.n_ensemble):\n\
    \            # transform testing data to representation\n            x_reduced\
    \ = self._deep_representation(self.net_lst[i], X)\n\n            # calculate outlier\
    \ scores\n            scores = _cal_score(x_reduced, self.iForest_lst[i])\n  \
    \          score_lst[i] = scores\n\n        final_scores = np.average(score_lst,\
    \ axis=0)\n        return final_scores\n\n    def _deep_representation(self, net,\
    \ X):\n        x_reduced = []\n\n        with torch.no_grad():\n            loader\
    \ = DataLoader(X, batch_size=self.batch_size,\n                              \
    \  drop_last=False, pin_memory=True,\n                                shuffle=False)\n\
    \            for batch_x in loader:\n                batch_x = batch_x.float().to(self.device)\n\
    \                batch_x_reduced = net(batch_x)\n                x_reduced.append(batch_x_reduced)\n\
    \n        x_reduced = torch.cat(x_reduced).data.cpu().numpy()\n        x_reduced\
    \ = StandardScaler().fit_transform(x_reduced)\n        x_reduced = np.tanh(x_reduced)\n\
    \        return x_reduced\n\n\nclass MLPnet(torch.nn.Module):\n    def __init__(self,\
    \ n_features, n_hidden=[500, 100], n_output=20,\n                 activation='ReLU',\
    \ bias=False, batch_norm=False,\n                 skip_connection=False):\n  \
    \      super(MLPnet, self).__init__()\n        self.skip_connection = skip_connection\n\
    \        self.n_output = n_output\n\n        num_layers = len(n_hidden)\n\n  \
    \      if type(activation) == str:\n            activation = [activation] * num_layers\n\
    \            activation.append(None)\n\n        assert len(activation) == len(\n\
    \            n_hidden) + 1, 'activation and n_hidden are not matched'\n\n    \
    \    self.layers = []\n        for i in range(num_layers + 1):\n            in_channels,\
    \ out_channels = \\\n                self.get_in_out_channels(i, num_layers, n_features,\n\
    \                                         n_hidden, n_output, skip_connection)\n\
    \            self.layers += [\n                LinearBlock(in_channels, out_channels,\n\
    \                            bias=bias, batch_norm=batch_norm,\n             \
    \               activation=activation[i],\n                            skip_connection=skip_connection\
    \ if i != num_layers else False)\n            ]\n        self.network = torch.nn.Sequential(*self.layers)\n\
    \n    def forward(self, x):\n        x = self.network(x)\n        return x\n\n\
    \    @staticmethod\n    def get_in_out_channels(i, num_layers, n_features, n_hidden,\
    \ n_output,\n                            skip_connection):\n        if skip_connection\
    \ is False:\n            in_channels = n_features if i == 0 else n_hidden[i -\
    \ 1]\n            out_channels = n_output if i == num_layers else n_hidden[i]\n\
    \        else:\n            in_channels = n_features if i == 0 else np.sum(\n\
    \                n_hidden[:i]) + n_features\n            out_channels = n_output\
    \ if i == num_layers else n_hidden[i]\n        return in_channels, out_channels\n\
    \n\nclass LinearBlock(torch.nn.Module):\n    def __init__(self, in_channels, out_channels,\n\
    \                 activation='Tanh', bias=False, batch_norm=False,\n         \
    \        skip_connection=False):\n        super(LinearBlock, self).__init__()\n\
    \n        self.skip_connection = skip_connection\n\n        self.linear = torch.nn.Linear(in_channels,\
    \ out_channels, bias=bias)\n\n        if activation is not None:\n           \
    \ # self.act_layer = _instantiate_class(\"torch.nn.modules.activation\", activation)\n\
    \            self.act_layer = get_activation_by_name(activation)\n        else:\n\
    \            self.act_layer = torch.nn.Identity()\n\n        self.batch_norm =\
    \ batch_norm\n        if batch_norm is True:\n            dim = out_channels\n\
    \            self.bn_layer = torch.nn.BatchNorm1d(dim, affine=bias)\n\n    def\
    \ forward(self, x):\n        x1 = self.linear(x)\n        x1 = self.act_layer(x1)\n\
    \n        if self.batch_norm is True:\n            x1 = self.bn_layer(x1)\n\n\
    \        if self.skip_connection:\n            x1 = torch.cat([x, x1], axis=1)\n\
    \n        return x1\n\n\ndef _cal_score(xx, clf):\n    depths = np.zeros((xx.shape[0],\
    \ len(clf.estimators_)))\n    depth_sum = np.zeros(xx.shape[0])\n    deviations\
    \ = np.zeros((xx.shape[0], len(clf.estimators_)))\n    leaf_samples = np.zeros((xx.shape[0],\
    \ len(clf.estimators_)))\n\n    for ii, estimator_tree in enumerate(clf.estimators_):\n\
    \        tree = estimator_tree.tree_\n        n_node = tree.node_count\n\n   \
    \     if n_node == 1:\n            continue\n\n        # get feature and threshold\
    \ of each node in the iTree\n        # in feature_lst, -2 indicates the leaf node\n\
    \        feature_lst, threshold_lst = tree.feature.copy(), tree.threshold.copy()\n\
    \n        # compute depth and score\n        leaves_index = estimator_tree.apply(xx)\n\
    \        node_indicator = estimator_tree.decision_path(xx)\n\n        # The number\
    \ of training samples in each test sample leaf\n        n_node_samples = estimator_tree.tree_.n_node_samples\n\
    \n        # node_indicator is a sparse matrix with shape (n_samples, n_nodes),\n\
    \        # indicating the path of input data samples\n        # each layer would\
    \ result in a non-zero element in this matrix,\n        # and then the row-wise\
    \ summation is the depth of data sample\n        n_samples_leaf = estimator_tree.tree_.n_node_samples[leaves_index]\n\
    \        d = (np.ravel(node_indicator.sum(axis=1)) + _average_path_length(\n \
    \           n_samples_leaf) - 1.0)\n        depths[:, ii] = d\n        depth_sum\
    \ += d\n\n        # decision path of data matrix XX\n        node_indicator =\
    \ np.array(node_indicator.todense())\n\n        # set a matrix with shape [n_sample,\
    \ n_node],\n        # representing the feature value of each sample on each node\n\
    \        # set the leaf node as -2\n        value_mat = np.array([xx[i][feature_lst]\
    \ for i in range(xx.shape[0])])\n        value_mat[:, np.where(feature_lst ==\
    \ -2)[0]] = -2\n        th_mat = np.array([threshold_lst for _ in range(xx.shape[0])])\n\
    \n        mat = np.abs(value_mat - th_mat) * node_indicator\n\n        exist =\
    \ (mat != 0)\n        dev = mat.sum(axis=1) / (exist.sum(axis=1) + 1e-6)\n   \
    \     deviations[:, ii] = dev\n\n    scores = 2 ** (-depth_sum / (len(clf.estimators_)\
    \ * _average_path_length(\n        [clf.max_samples_])))\n    deviation = np.mean(deviations,\
    \ axis=1)\n    leaf_sample = (clf.max_samples_ - np.mean(leaf_samples,\n     \
    \                                         axis=1)) / clf.max_samples_\n\n    scores\
    \ = scores * deviation\n    # scores = scores * deviation * leaf_sample\n    return\
    \ scores\n\n\ndef _average_path_length(n_samples_leaf):\n    \"\"\"\n    The average\
    \ path length in a n_samples iTree, which is equal to\n    the average path length\
    \ of an unsuccessful BST search since the\n    latter has the same structure as\
    \ an isolation tree.\n    Parameters\n    ----------\n    n_samples_leaf : array-like\
    \ of shape (n_samples,)\n        The number of training samples in each test sample\
    \ leaf, for\n        each estimators.\n\n    Returns\n    -------\n    average_path_length\
    \ : ndarray of shape (n_samples,)\n    \"\"\"\n\n    n_samples_leaf = check_array(n_samples_leaf,\
    \ ensure_2d=False)\n\n    n_samples_leaf_shape = n_samples_leaf.shape\n    n_samples_leaf\
    \ = n_samples_leaf.reshape((1, -1))\n    average_path_length = np.zeros(n_samples_leaf.shape)\n\
    \n    mask_1 = n_samples_leaf <= 1\n    mask_2 = n_samples_leaf == 2\n    not_mask\
    \ = ~np.logical_or(mask_1, mask_2)\n\n    average_path_length[mask_1] = 0.\n \
    \   average_path_length[mask_2] = 1.\n    average_path_length[not_mask] = (\n\
    \            2.0 * (np.log(n_samples_leaf[not_mask] - 1.0) + np.euler_gamma)\n\
    \            - 2.0 * (n_samples_leaf[not_mask] - 1.0) / n_samples_leaf[not_mask]\n\
    \    )\n\n    return average_path_length.reshape(n_samples_leaf_shape)\n\n###\
    \ Source File Dependency Files Content\n### Dependency File: base.py\n# -*- coding:\
    \ utf-8 -*-\n\"\"\"Base class for all outlier detector models\n\"\"\"\n# Author:\
    \ Yue Zhao <yzhao062@gmail.com>\n# License: BSD 2 clause\n\n\nimport abc\nimport\
    \ warnings\nfrom collections import defaultdict\nfrom inspect import signature\n\
    \nimport numpy as np\nfrom numpy import percentile\nfrom scipy.special import\
    \ erf\nfrom scipy.stats import binom\nfrom sklearn.metrics import roc_auc_score\n\
    from sklearn.preprocessing import MinMaxScaler\nfrom sklearn.utils import deprecated\n\
    from sklearn.utils.multiclass import check_classification_targets\nfrom sklearn.utils.validation\
    \ import check_is_fitted\nfrom scipy.optimize import root_scalar\n\nfrom .sklearn_base\
    \ import _pprint\nfrom ..utils.utility import precision_n_scores\n\n\nclass BaseDetector(metaclass=abc.ABCMeta):\n\
    \    \"\"\"Abstract class for all outlier detection algorithms.\n\n\n    Parameters\n\
    \    ----------\n    contamination : float in (0., 0.5), optional (default=0.1)\n\
    \        The amount of contamination of the data set,\n        i.e. the proportion\
    \ of outliers in the data set. Used when fitting to\n        define the threshold\
    \ on the decision function.\n\n    Attributes\n    ----------\n    decision_scores_\
    \ : numpy array of shape (n_samples,)\n        The outlier scores of the training\
    \ data.\n        The higher, the more abnormal. Outliers tend to have higher\n\
    \        scores. This value is available once the detector is fitted.\n\n    threshold_\
    \ : float\n        The threshold is based on ``contamination``. It is the\n  \
    \      ``n_samples * contamination`` most abnormal samples in\n        ``decision_scores_``.\
    \ The threshold is calculated for generating\n        binary outlier labels.\n\
    \n    labels_ : int, either 0 or 1\n        The binary labels of the training\
    \ data. 0 stands for inliers\n        and 1 for outliers/anomalies. It is generated\
    \ by applying\n        ``threshold_`` on ``decision_scores_``.\n    \"\"\"\n\n\
    \    @abc.abstractmethod\n    def __init__(self, contamination=0.1):\n\n     \
    \   if (isinstance(contamination, (float, int))):\n\n            if not (0. <\
    \ contamination <= 0.5):\n                raise ValueError(\"contamination must\
    \ be in (0, 0.5], \"\n                                 \"got: %f\" % contamination)\n\
    \n        # allow arbitrary input such as PyThreshld object\n        self.contamination\
    \ = contamination\n\n    # noinspection PyIncorrectDocstring\n    @abc.abstractmethod\n\
    \    def fit(self, X, y=None):\n        \"\"\"Fit detector. y is ignored in unsupervised\
    \ methods.\n\n        Parameters\n        ----------\n        X : numpy array\
    \ of shape (n_samples, n_features)\n            The input samples.\n\n       \
    \ y : Ignored\n            Not used, present for API consistency by convention.\n\
    \n        Returns\n        -------\n        self : object\n            Fitted\
    \ estimator.\n        \"\"\"\n        pass\n\n    @abc.abstractmethod\n    def\
    \ decision_function(self, X):\n        \"\"\"Predict raw anomaly scores of X using\
    \ the fitted detector.\n\n        The anomaly score of an input sample is computed\
    \ based on the fitted\n        detector. For consistency, outliers are assigned\
    \ with\n        higher anomaly scores.\n\n        Parameters\n        ----------\n\
    \        X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples. Sparse matrices are accepted only\n            if they are supported\
    \ by the base estimator.\n\n        Returns\n        -------\n        anomaly_scores\
    \ : numpy array of shape (n_samples,)\n            The anomaly score of the input\
    \ samples.\n        \"\"\"\n        pass\n\n    @deprecated()\n    def fit_predict(self,\
    \ X, y=None):\n        \"\"\"Fit detector first and then predict whether a particular\
    \ sample\n        is an outlier or not. y is ignored in unsupervised models.\n\
    \n        Parameters\n        ----------\n        X : numpy array of shape (n_samples,\
    \ n_features)\n            The input samples.\n\n        y : Ignored\n       \
    \     Not used, present for API consistency by convention.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n\n        .. deprecated:: 0.6.9\n          `fit_predict`\
    \ will be removed in pyod 0.8.0.; it will be\n          replaced by calling `fit`\
    \ function first and then accessing\n          `labels_` attribute for consistency.\n\
    \        \"\"\"\n\n        self.fit(X, y)\n        return self.labels_\n\n   \
    \ def predict(self, X, return_confidence=False):\n        \"\"\"Predict if a particular\
    \ sample is an outlier or not.\n\n        Parameters\n        ----------\n   \
    \     X : numpy array of shape (n_samples, n_features)\n            The input\
    \ samples.\n\n        return_confidence : boolean, optional(default=False)\n \
    \           If True, also return the confidence of prediction.\n\n        Returns\n\
    \        -------\n        outlier_labels : numpy array of shape (n_samples,)\n\
    \            For each observation, tells whether\n            it should be considered\
    \ as an outlier according to the\n            fitted model. 0 stands for inliers\
    \ and 1 for outliers.\n        confidence : numpy array of shape (n_samples,).\n\
    \            Only if return_confidence is set to True.\n        \"\"\"\n\n   \
    \     check_is_fitted(self, ['decision_scores_', 'threshold_', 'labels_'])\n \
    \       pred_score = self.decision_function(X)\n\n        if isinstance(self.contamination,\
    \ (float, int)):\n            prediction = (pred_score > self.threshold_).astype('int').ravel()\n\
    \n        # if this is a PyThresh object\n        else:\n            prediction\
    \ = self.contamination.eval(pred_score)\n\n        if return_confidence:\n   \
    \         confidence = self.predict_confidence(X)\n            return prediction,\
    \ confidence\n\n        return prediction\n\n    def predict_proba(self, X, method='linear',\
    \ return_confidence=False):\n        \"\"\"Predict the probability of a sample\
    \ being outlier. Two approaches\n        are possible:\n\n        1. simply use\
    \ Min-max conversion to linearly transform the outlier\n           scores into\
    \ the range of [0,1]. The model must be\n           fitted first.\n        2.\
